# =============================================================================
# Load Balancer Configuration for Alumate Platform
# =============================================================================
# This configuration provides:
#   - Application load balancing with weighted round-robin
#   - Session persistence for authenticated routes
#   - SSL termination and offloading
#   - Health check integration
#   - Failover configuration
# =============================================================================

# =============================================================================
# HTTP SERVER BLOCK - Redirect to HTTPS
# =============================================================================
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    
    # Root directory for ACME challenges
    root /var/www/html/public;
    
    # Handle ACME challenges for Let's Encrypt certificate issuance/renewal
    location ^~ /.well-known/acme-challenge/ {
        allow all;
        root /var/www/letsencrypt;
        try_files $uri =404;
    }
    
    # Health check endpoint (no redirect)
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
    
    # Load balancer status endpoint
    location /lb-status {
        access_log off;
        return 200 "Load Balancer Active\n";
        add_header Content-Type text/plain;
    }
    
    # Redirect all HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
    
    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}

# =============================================================================
# MAIN HTTPS SERVER BLOCK - Load Balanced Application
# =============================================================================
server {
    # Listen on port 443 with HTTP/2 for improved performance
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    
    # Server names (main domain + www)
    server_name alumni-platform.com www.alumni-platform.com;
    
    # Document root
    root /var/www/html/public;
    index index.php;
    
    # =============================================================================
    # SSL CERTIFICATE CONFIGURATION
    # =============================================================================
    # Update these paths for your SSL certificates
    # Let's Encrypt certificates:
    ssl_certificate /etc/letsencrypt/live/alumni-platform.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/alumni-platform.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/alumni-platform.com/chain.pem;
    
    # Include SSL parameters for secure connections
    include /etc/nginx/snippets/ssl-params.conf;
    
    # Include security headers
    include /etc/nginx/snippets/security-headers.conf;
    
    # =============================================================================
    # MAIN APPLICATION LOCATION - Load Balanced
    # =============================================================================
    location / {
        try_files $uri $uri/ /index.php?$query_string;
        
        # Apply rate limiting (PHP zone)
        limit_req zone=php burst=20 nodelay;
        
        # Load balance to primary app servers
        proxy_pass http://app_primary;
        
        # Proxy settings for load balancing
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        
        # Connection settings
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Buffering settings
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 32k;
        proxy_busy_buffers_size 64k;
        
        # Pass PHP requests to PHP-FPM load balancer
        location ~ \.php$ {
            fastcgi_pass app_primary;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            fastcgi_param DOCUMENT_ROOT $realpath_root;
            include fastcgi_params;
            
            # Tenant context for multi-tenancy
            fastcgi_param TENANT_DOMAIN $host;
            
            # Session persistence header
            fastcgi_param X_SESSION_PERSISTENCE $cookie_PHPSESSID;
        }
    }
    
    # =============================================================================
    # AUTHENTICATED ROUTES - Session Persistence
    # =============================================================================
    location /auth/ {
        # Use session-aware load balancer for authenticated routes
        proxy_pass http://app_sessions;
        
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        
        # Session persistence via IP hash (configured in upstream)
        proxy_set_header X-Session-ID $cookie_PHPSESSID;
        
        # Longer timeout for authenticated operations
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        
        limit_req zone=php burst=10 nodelay;
        
        location ~ \.php$ {
            fastcgi_pass app_sessions;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            fastcgi_param DOCUMENT_ROOT $realpath_root;
            include fastcgi_params;
            
            fastcgi_param TENANT_DOMAIN $host;
        }
    }
    
    # =============================================================================
    # STATIC ASSETS - Long-term caching (no load balancing needed)
    # =============================================================================
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot|map)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Cache-Status HIT;
        try_files $uri =404;
        
        # Disable rate limiting for static assets
        limit_req off;
    }
    
    # =============================================================================
    # API ENDPOINTS - Rate limited load balanced
    # =============================================================================
    location /api/ {
        try_files $uri $uri/ /index.php?$query_string;
        
        # Apply rate limiting (API zone)
        limit_req zone=api burst=50 nodelay;
        
        # No caching for API responses
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
        add_header Pragma "no-cache" always;
        
        # Load balance API requests
        proxy_pass http://app_primary;
        
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        
        # Handle PHP API requests
        location ~ \.php$ {
            fastcgi_pass app_primary;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            fastcgi_param DOCUMENT_ROOT $realpath_root;
            
            fastcgi_param TENANT_DOMAIN $host;
            fastcgi_param X_REQUEST_ID $request_id;
        }
    }
    
    # =============================================================================
    # WEBSOCKET ENDPOINTS - Sticky Sessions Required
    # =============================================================================
    location /websocket/ {
        proxy_pass http://websocket_backend;
        proxy_http_version 1.1;
        
        # WebSocket upgrade headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Sticky session header (ip_hash in upstream handles this)
        proxy_set_header X-WebSocket-Session $cookie_WEBSOCKET_ID;
        
        # Long timeout for WebSocket connections
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        
        # Disable buffering for WebSocket
        proxy_buffering off;
    }
    
    # =============================================================================
    # ADMIN PANEL - Extra protection + Session persistence
    # =============================================================================
    location /admin/ {
        # Use session-aware load balancer
        proxy_pass http://app_sessions;
        
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Extra rate limiting for admin
        limit_req zone=php burst=10 nodelay;
        
        # Consider adding IP whitelist or basic auth here
        # auth_basic "Admin Area";
        # auth_basic_user_file /etc/nginx/.htpasswd;
        
        location ~ \.php$ {
            fastcgi_pass app_sessions;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            fastcgi_param DOCUMENT_ROOT $realpath_root;
            
            fastcgi_param TENANT_DOMAIN $host;
        }
    }
    
    # =============================================================================
    # ANALYTICS ENDPOINTS - Isolated Load Balancer
    # =============================================================================
    location /analytics/ {
        # Use dedicated analytics load balancer
        proxy_pass http://analytics_backend;
        
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Longer timeouts for analytics processing
        proxy_connect_timeout 30s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        
        # Cache analytics responses
        proxy_buffering on;
        proxy_cache_valid 200 5m;
        add_header X-Cache-Status $upstream_cache_status;
    }
    
    # =============================================================================
    # HEALTH CHECK ENDPOINTS - For Load Balancer Monitoring
    # =============================================================================
    location /lb-health {
        access_log off;
        
        # Return 200 if load balancer is healthy
        return 200 "LB OK\n";
        add_header Content-Type text/plain;
        add_header X-LB-Status "active";
    }
    
    location /upstream-health {
        access_log off;
        
        # Detailed upstream health information
        return 200 "Upstream: app_primary, app_backup, websocket_backend, analytics_backend\n";
        add_header Content-Type text/plain;
    }
    
    # =============================================================================
    # SECURITY - Deny access to sensitive files
    # =============================================================================
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    location ~ \.(env|log|htaccess|ini|conf)$ {
        deny all;
        return 404;
    }
    
    location ~ \.php$ {
        # Only allow in specific locations
        # This prevents direct PHP access from root
        deny all;
        return 404;
    }
    
    # =============================================================================
    # ERROR PAGES
    # =============================================================================
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
    
    # Custom error page locations
    location = /404.html {
        internal;
        root /var/www/html/public;
    }
    
    location = /50x.html {
        internal;
        root /var/www/html/public;
    }
}

# =============================================================================
# TENANT SUBDOMAIN CONFIGURATION - Load Balanced
# =============================================================================
# Handles dynamic subdomains like tenant.alumni-platform.com
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    
    # Regex pattern for tenant subdomains
    server_name ~^(?<tenant>.+)\.alumni-platform\.com$;
    
    root /var/www/html/public;
    index index.php;
    
    # =============================================================================
    # SSL CERTIFICATE FOR WILDCARD
    # =============================================================================
    # Use wildcard certificate for all subdomains
    ssl_certificate /etc/letsencrypt/live/alumni-platform.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/alumni-platform.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/alumni-platform.com/chain.pem;
    
    include /etc/nginx/snippets/ssl-params.conf;
    include /etc/nginx/snippets/security-headers.conf;
    
    # =============================================================================
    # TENANT APPLICATION - Load Balanced
    # =============================================================================
    location / {
        try_files $uri $uri/ /index.php?$query_string;
        
        # Rate limiting
        limit_req zone=php burst=20 nodelay;
        
        # Load balance tenant requests
        proxy_pass http://app_primary;
        
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Tenant-ID $tenant;
        
        # Pass PHP requests to load balancer
        location ~ \.php$ {
            fastcgi_pass app_primary;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            fastcgi_param DOCUMENT_ROOT $realpath_root;
            include fastcgi_params;
            
            # Set tenant context variables
            fastcgi_param TENANT_DOMAIN $tenant.alumni-platform.com;
            fastcgi_param TENANT_ID $tenant;
        }
    }
    
    # =============================================================================
    # STATIC ASSETS - Cached for performance
    # =============================================================================
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
        
        limit_req off;
    }
    
    # =============================================================================
    # API ENDPOINTS FOR TENANT - Load Balanced
    # =============================================================================
    location /api/ {
        try_files $uri $uri/ /index.php?$query_string;
        
        limit_req zone=api burst=50 nodelay;
        
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
        
        # Load balance API requests
        proxy_pass http://app_primary;
        
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Tenant-ID $tenant;
        
        location ~ \.php$ {
            fastcgi_pass app_primary;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            fastcgi_param DOCUMENT_ROOT $realpath_root;
            
            # Pass tenant context
            fastcgi_param TENANT_DOMAIN $tenant.alumni-platform.com;
            fastcgi_param TENANT_ID $tenant;
        }
    }
    
    # =============================================================================
    # TENANT HEALTH CHECK
    # =============================================================================
    location /tenant-health {
        access_log off;
        return 200 "Tenant: $tenant - OK\n";
        add_header Content-Type text/plain;
        add_header X-Tenant-ID $tenant;
    }
    
    # =============================================================================
    # SECURITY
    # =============================================================================
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    location ~ \.(env|log|htaccess)$ {
        deny all;
        return 404;
    }
}
