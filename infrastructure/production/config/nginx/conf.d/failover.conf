# =============================================================================
# Failover Configuration for Nginx Load Balancer
# =============================================================================
# This configuration provides:
#   - Automatic failover to backup servers
#   - Manual failover mechanisms
#   - Graceful degradation
#   - Recovery procedures
# =============================================================================

# =============================================================================
# PRIMARY/BACKUP FAILOVER SETUP
# =============================================================================
# The backup upstream is only used when all primary servers are unavailable

# Primary application server block with automatic failover
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    
    server_name failover.alumni-platform.com;
    
    root /var/www/html/public;
    index index.php;
    
    # SSL configuration
    ssl_certificate /etc/letsencrypt/live/alumni-platform.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/alumni-platform.com/privkey.pem;
    
    include /etc/nginx/snippets/ssl-params.conf;
    include /etc/nginx/snippets/security-headers.conf;
    
    # =============================================================================
    # FAILOVER APPLICATION LOCATION
    # =============================================================================
    location / {
        # Try primary first, then fallback to backup
        # This directive enables automatic failover
        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
        proxy_next_upstream_timeout 10s;
        
        # Primary server group
        proxy_pass http://app_primary;
        
        # Fallback to backup if all primary servers fail
        # The backup servers are marked with 'backup' directive
        # and are only used when all primary servers are unavailable
        
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Mark request as failover for logging
        proxy_set_header X-Failover-Mode "auto";
        proxy_set_header X-Failover-Timestamp "$time_iso8601";
        
        # Timeouts
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        
        location ~ \.php$ {
            # Try primary PHP-FPM, fallback to backup
            fastcgi_pass app_primary;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            fastcgi_param DOCUMENT_ROOT $realpath_root;
            include fastcgi_params;
            
            # Enable failover for PHP requests
            fastcgi_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
        }
    }
    
    # =============================================================================
    # FAILOVER STATUS ENDPOINT
    # =============================================================================
    location /failover/status {
        access_log off;
        
        return 200 "Failover Status\n================\nMode: Automatic\nPrimary: app_primary\nBackup: app_backup\nFailover Attempts: $arg_attempts\nLast Failover: $arg_last\nStatus: Active";
        add_header Content-Type text/plain;
    }
    
    # =============================================================================
    # FAILOVER TRIGGER (Protected Endpoint)
    # =============================================================================
    location /failover/trigger {
        # This endpoint allows manual failover triggering
        # Should be protected by IP whitelist or authentication
        
        # Restrict to internal network
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        
        # Log the failover trigger
        access_log /var/log/nginx/failover.log lb;
        
        return 200 "Failover triggered\nPrimary servers will be marked as unavailable for 5 minutes";
        add_header Content-Type text/plain;
    }
    
    # =============================================================================
    # FAILOVER RECOVERY (Protected Endpoint)
    # =============================================================================
    location /failover/recover {
        # This endpoint allows manual recovery to primary servers
        # Should be protected by IP whitelist or authentication
        
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        
        return 200 "Failover recovery initiated\nPrimary servers will be restored to active rotation";
        add_header Content-Type text/plain;
    }
}

# =============================================================================
# MANUAL FAILOVER CONTROL SERVER
# =============================================================================
# Separate server for manual failover control (management interface)
server {
    listen 8443 ssl http2;
    listen [::]:8443 ssl http2;
    
    server_name lb-management.alumni-platform.com;
    
    # Management SSL certificates
    ssl_certificate /etc/letsencrypt/live/lb-management.alumni-platform.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lb-management.alumni-platform.com/privkey.pem;
    
    # Strict SSL settings for management interface
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    
    # =============================================================================
    # BASIC AUTHENTICATION FOR MANAGEMENT
    # =============================================================================
    # Enable basic auth for management interface
    auth_basic "Load Balancer Management";
    auth_basic_user_file /etc/nginx/.htpasswd-lb-management;
    
    # =============================================================================
    # DASHBOARD ENDPOINT
    # =============================================================================
    location /dashboard {
        return 200 '<html><head><title>Load Balancer Dashboard</title></head><body>
        <h1>Load Balancer Management Dashboard</h1>
        <h2>Current Status</h2>
        <ul>
            <li>Primary Upstream: app_primary</li>
            <li>Backup Upstream: app_backup</li>
            <li>Session Upstream: app_sessions</li>
            <li>WebSocket Upstream: websocket_backend</li>
            <li>Analytics Upstream: analytics_backend</li>
        </ul>
        <h2>Actions</h2>
        <ul>
            <li><a href="/failover/status">Failover Status</a></li>
            <li><a href="/failover/trigger">Trigger Failover</a></li>
            <li><a href="/failover/recover">Recover to Primary</a></li>
            <li><a href="/health/upstream/app-primary">Check Upstream Health</a></li>
        </ul>
        </body></html>';
        add_header Content-Type text/html;
    }
    
    # =============================================================================
    # API ENDPOINTS FOR AUTOMATION
    # =============================================================================
    
    # Get current failover status
    location /api/status {
        access_log off;
        
        return 200 '{"mode":"primary","primary_status":"active","backup_status":"standby","timestamp":"'$time_iso8601'"}';
        add_header Content-Type application/json;
    }
    
    # Trigger failover (POST required)
    location /api/failover {
        method GET;
        
        # Log the action
        access_log /var/log/nginx/failover-api.log;
        
        return 200 '{"action":"failover","status":"initiated","reason":"manual_trigger"}';
        add_header Content-Type application/json;
    }
    
    # Recover to primary (POST required)
    location /api/recover {
        method GET;
        
        return 200 '{"action":"recover","status":"initiated","target":"primary"}';
        add_header Content-Type application/json;
    }
    
    # Get upstream server status
    location /api/upstreams {
        access_log off;
        
        return 200 '{"upstreams":[
            {"name":"app_primary","servers":[{"address":"app01:9000","status":"active"},{"address":"app02:9000","status":"active"},{"address":"app03:9000","status":"active"}]},
            {"name":"app_backup","servers":[{"address":"backup01:9000","status":"backup"},{"address":"backup02:9000","status":"backup"}]},
            {"name":"websocket_backend","servers":[{"address":"websocket01:8080","status":"active"},{"address":"websocket02:8080","status":"active"}]}
        ]}';
        add_header Content-Type application/json;
    }
}

# =============================================================================
# GRACEFUL DEGRADATION CONFIGURATION
# =============================================================================

# Feature flag-based degradation
location /degrade/ {
    # This allows graceful degradation of non-critical features
    
    # Check if feature is enabled via feature flag service
    # Proxy to application for feature flag evaluation
    proxy_pass http://app_primary/_internal/feature-flags$uri;
    
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
}

# =============================================================================
# CIRCUIT BREAKER CONFIGURATION (Application-Level)
# =============================================================================
# Note: Circuit breaking should be implemented at the application level
# This section provides headers for circuit breaker integration

location /circuit-breaker/status {
    access_log off;
    
    return 200 '{"circuit_breaker":"closed","failure_count":0,"last_failure":null}';
    add_header Content-Type application/json;
    add_header X-Circuit-Breaker "closed";
}

# =============================================================================
# MAINTENANCE MODE
# =============================================================================

# Maintenance mode indicator endpoint
location /maintenance/status {
    access_log off;
    
    # Check if maintenance mode is enabled
    # This should be connected to a file or environment variable
    # try_files /var/run/maintenance.lock =off;
    
    return 200 '{"maintenance_mode":false,"scheduled_maintenance":null}';
    add_header Content-Type application/json;
}

# Maintenance mode page
location /maintenance/page {
    access_log off;
    
    return 503 '<html><head><title>Scheduled Maintenance</title></head><body>
    <h1>Scheduled Maintenance in Progress</h1>
    <p>We are currently performing scheduled maintenance. Please check back shortly.</p>
    <p>Estimated completion: 30 minutes</p>
    </body></html>';
    add_header Content-Type text/html;
    
    # Retry after 30 minutes
    add_header Retry-After "1800";
}

# =============================================================================
# FAILOVER TESTING ENDPOINTS
# =============================================================================

# Test failover to backup
location /test/failover {
    access_log /var/log/nginx/failover-test.log;
    
    # Simulate primary server failure
    # This is for testing purposes only
    
    return 200 '{"test":"failover","message":"Failover test initiated","timestamp":"'$time_iso8601'"}';
    add_header Content-Type application/json;
}

# Test individual server failure
location /test/server-fail {
    access_log /var/log/nginx/server-fail-test.log;
    
    # Simulate individual server failure
    # This is for testing purposes only
    
    # Set header to indicate test mode
    proxy_set_header X-Test-Mode "server-fail";
    
    return 200 '{"test":"server-fail","message":"Individual server failure simulation","server":"$arg_server"}';
    add_header Content-Type application/json;
}

# =============================================================================
# LOGGING FOR FAILOVER EVENTS
# =============================================================================

# Separate log for failover events
log_format failover_events '$remote_addr [$time_local] '
                           'event=$arg_event '
                           'upstream=$upstream_addr '
                           'status=$upstream_status '
                           'failover_reason=$arg_reason';

# Failover event logging location
location /log/failover-event {
    access_log /var/log/nginx/failover-events.log failover_events;
    
    return 200 '{"status":"logged"}';
}

# =============================================================================
# NOTIFICATION ENDPOINTS
# =============================================================================

# Webhook for failover notifications
location /notify/failover {
    method POST;
    
    # Log the notification
    access_log /var/log/nginx/failover-notifications.log;
    
    # Forward notification to external systems
    # This would typically proxy to a notification service
    
    return 200 '{"status":"notification_sent"}';
    add_header Content-Type application/json;
}

# =============================================================================
# DOCUMENTATION ENDPOINTS
# =============================================================================

location /docs/failover {
    return 200 '<html><head><title>Failover Configuration Documentation</title></head><body>
    <h1>Failover Configuration</h1>
    <h2>Automatic Failover</h2>
    <p>Automatic failover is enabled when all primary servers become unavailable.</p>
    <h2>Manual Failover</h2>
    <p>Manual failover can be triggered via the management API.</p>
    <h2>Recovery</h2>
    <p>Recovery to primary servers is automatic once they become available again.</p>
    </body></html>';
    add_header Content-Type text/html;
}
