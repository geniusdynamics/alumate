# =============================================================================
# Alumate Platform - Production Nginx Configuration
# =============================================================================
# This configuration provides:
#   - HTTP to HTTPS redirect
#   - SSL/TLS termination with modern security settings
#   - Multi-tenant subdomain support
#   - Security headers
#   - Rate limiting
#   - ACME challenge for Let's Encrypt
# =============================================================================

# =============================================================================
# HTTP SERVER BLOCK - Redirect to HTTPS
# =============================================================================
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    
    # Root directory for ACME challenges
    root /var/www/html/public;
    
    # Handle ACME challenges for Let's Encrypt certificate issuance/renewal
    location ^~ /.well-known/acme-challenge/ {
        allow all;
        root /var/www/letsencrypt;
        try_files $uri =404;
    }
    
    # Health check endpoint (no redirect)
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
    
    # Redirect all HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
    
    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}

# =============================================================================
# MAIN HTTPS SERVER BLOCK
# =============================================================================
server {
    # Listen on port 443 with HTTP/2 for improved performance
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    
    # Server names (main domain + www)
    server_name alumni-platform.com www.alumni-platform.com;
    
    # Document root
    root /var/www/html/public;
    index index.php;
    
    # =============================================================================
    # SSL CERTIFICATE CONFIGURATION
    # =============================================================================
    # Update these paths for your SSL certificates
    # Let's Encrypt certificates:
    ssl_certificate /etc/letsencrypt/live/alumni-platform.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/alumni-platform.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/alumni-platform.com/chain.pem;
    
    # Include SSL parameters for secure connections
    include /etc/nginx/snippets/ssl-params.conf;
    
    # Include security headers
    include /etc/nginx/snippets/security-headers.conf;
    
    # =============================================================================
    # MAIN APPLICATION LOCATION
    # =============================================================================
    location / {
        try_files $uri $uri/ /index.php?$query_string;
        
        # Apply rate limiting (PHP zone)
        limit_req zone=php burst=20 nodelay;
        
        # Pass PHP requests to PHP-FPM
        location ~ \.php$ {
            fastcgi_pass php_backend;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            fastcgi_param DOCUMENT_ROOT $realpath_root;
            include fastcgi_params;
            
            # Tenant context for multi-tenancy
            fastcgi_param TENANT_DOMAIN $host;
        }
    }
    
    # =============================================================================
    # STATIC ASSETS - Long-term caching
    # =============================================================================
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot|map)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Cache-Status HIT;
        try_files $uri =404;
    }
    
    # =============================================================================
    # API ENDPOINTS - Rate limited and no caching
    # =============================================================================
    location /api/ {
        try_files $uri $uri/ /index.php?$query_string;
        
        # Apply rate limiting (API zone)
        limit_req zone=api burst=50 nodelay;
        
        # No caching for API responses
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
        add_header Pragma "no-cache" always;
        
        location ~ \.php$ {
            fastcgi_pass php_backend;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            fastcgi_param DOCUMENT_ROOT $realpath_root;
        }
    }
    
    # =============================================================================
    # WEBSOCKET ENDPOINTS - Real-time features
    # =============================================================================
    location /websocket/ {
        proxy_pass http://websocket_backend;
        proxy_http_version 1.1;
        
        # WebSocket upgrade headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Long timeout for WebSocket connections
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }
    
    # =============================================================================
    # ADMIN PANEL - Extra protection
    # =============================================================================
    location /admin/ {
        # Consider adding IP whitelist or basic auth here
        # auth_basic "Admin Area";
        # auth_basic_user_file /etc/nginx/.htpasswd;
        
        location ~ \.php$ {
            fastcgi_pass php_backend;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            fastcgi_param DOCUMENT_ROOT $realpath_root;
            
            # Extra rate limiting for admin
            limit_req zone=php burst=10 nodelay;
        }
    }
    
    # =============================================================================
    # HEALTH CHECK ENDPOINT
    # =============================================================================
    location /health-check {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }
    
    # =============================================================================
    # SECURITY - Deny access to sensitive files
    # =============================================================================
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    location ~ \.(env|log|htaccess|ini|conf)$ {
        deny all;
        return 404;
    }
    
    location ~ \.php$ {
        # Only allow in specific locations
        # This prevents direct PHP access from root
        deny all;
        return 404;
    }
    
    # =============================================================================
    # ERROR PAGES
    # =============================================================================
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
    
    # Custom error page locations
    location = /404.html {
        internal;
        root /var/www/html/public;
    }
    
    location = /50x.html {
        internal;
        root /var/www/html/public;
    }
}

# =============================================================================
# TENANT SUBDOMAIN CONFIGURATION
# =============================================================================
# Handles dynamic subdomains like tenant.alumni-platform.com
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    
    # Regex pattern for tenant subdomains
    server_name ~^(?<tenant>.+)\.alumni-platform\.com$;
    
    root /var/www/html/public;
    index index.php;
    
    # =============================================================================
    # SSL CERTIFICATE FOR WILDCARD
    # =============================================================================
    # Use wildcard certificate for all subdomains
    # Or use per-subdomain certificates (requires additional setup)
    ssl_certificate /etc/letsencrypt/live/alumni-platform.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/alumni-platform.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/alumni-platform.com/chain.pem;
    
    include /etc/nginx/snippets/ssl-params.conf;
    include /etc/nginx/snippets/security-headers.conf;
    
    # =============================================================================
    # TENANT APPLICATION
    # =============================================================================
    location / {
        try_files $uri $uri/ /index.php?$query_string;
        
        # Rate limiting
        limit_req zone=php burst=20 nodelay;
        
        location ~ \.php$ {
            fastcgi_pass php_backend;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            fastcgi_param DOCUMENT_ROOT $realpath_root;
            include fastcgi_params;
            
            # Set tenant context variables
            fastcgi_param TENANT_DOMAIN $tenant.alumni-platform.com;
            fastcgi_param TENANT_ID $tenant;
        }
    }
    
    # =============================================================================
    # STATIC ASSETS - Cached for performance
    # =============================================================================
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    
    # =============================================================================
    # API ENDPOINTS FOR TENANT
    # =============================================================================
    location /api/ {
        try_files $uri $uri/ /index.php?$query_string;
        
        limit_req zone=api burst=50 nodelay;
        
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
        
        location ~ \.php$ {
            fastcgi_pass php_backend;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            fastcgi_param DOCUMENT_ROOT $realpath_root;
            
            # Pass tenant context
            fastcgi_param TENANT_DOMAIN $tenant.alumni-platform.com;
            fastcgi_param TENANT_ID $tenant;
        }
    }
    
    # =============================================================================
    # SECURITY
    # =============================================================================
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    location ~ \.(env|log|htaccess)$ {
        deny all;
        return 404;
    }
}
