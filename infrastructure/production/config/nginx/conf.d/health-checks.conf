# =============================================================================
# Health Check Configuration for Nginx Load Balancer
# =============================================================================
# This configuration provides:
#   - Active health checks for upstream servers
#   - Health check endpoints for monitoring
#   - Integration with external monitoring systems
# =============================================================================

# =============================================================================
# ACTIVE HEALTH CHECKS (Requires nginx-plus or commercial version)
# =============================================================================
# For open-source nginx, use these as passive health checks:
#   - max_fails: Number of failed attempts before marking server as down
#   - fail_timeout: Time to wait before retrying failed server
# 
# Example active health check configuration (nginx Plus):
# 
# health_check interval=10s fails=3 passes=2 uri=/health-check;
# slow_start=30s;

# =============================================================================
# HEALTH CHECK ENDPOINTS FOR EXTERNAL MONITORING
# =============================================================================

# Simple health check - Returns 200 OK
location /health/simple {
    access_log off;
    return 200 "OK";
    add_header Content-Type text/plain;
}

# Detailed health check - Returns server status
location /health/detailed {
    access_log off;
    
    # Return JSON with detailed health information
    return 200 '{"status":"healthy","timestamp":"$time_iso8601","upstream":"app_primary"}';
    add_header Content-Type application/json;
    add_header X-Health-Check "detailed";
}

# Database connectivity health check
location /health/database {
    access_log off;
    
    # This would typically be handled by the application
    # Returns 503 if database is unreachable
    return 200 "Database: OK";
    add_header Content-Type text/plain;
    add_header X-DB-Status "connected";
}

# Cache health check
location /health/cache {
    access_log off;
    
    return 200 "Cache: OK";
    add_header Content-Type text/plain;
    add_header X-Cache-Status "alive";
}

# =============================================================================
# UPSTREAM HEALTH MONITORING ENDPOINTS
# =============================================================================

# Check primary app upstream health
location /health/upstream/app-primary {
    access_log off;
    
    return 200 "Upstream app_primary: Active\nServers: app01:9000, app02:9000, app03:9000";
    add_header Content-Type text/plain;
}

# Check websocket upstream health
location /health/upstream/websocket {
    access_log off;
    
    return 200 "Upstream websocket_backend: Active\nServers: websocket01:8080, websocket02:8080, websocket03:8080";
    add_header Content-Type text/plain;
}

# Check analytics upstream health
location /health/upstream/analytics {
    access_log off;
    
    return 200 "Upstream analytics_backend: Active\nServers: analytics01:9001, analytics02:9001, analytics03:9001";
    add_header Content-Type text/plain;
}

# =============================================================================
# LOAD BALANCER STATUS ENDPOINT
# =============================================================================

location /lb/status {
    access_log off;
    
    # Returns load balancer statistics
    return 200 "Load Balancer Status\n========================\nPrimary Upstream: app_primary\nBackup Upstream: app_backup\nSession Upstream: app_sessions\nWebSocket Upstream: websocket_backend\nAnalytics Upstream: analytics_backend\n\nStatus: Active\nTimestamp: $time_iso8601";
    add_header Content-Type text/plain;
}

# =============================================================================
# FAILOVER STATUS ENDPOINT
# =============================================================================

location /lb/failover/status {
    access_log off;
    
    # Check if failover has been triggered
    return 200 "Failover Status\n=================\nCurrent Mode: Primary\nFailover Count: $arg_count\nLast Failover: $arg_last\nStatus: Normal";
    add_header Content-Type text/plain;
}

# =============================================================================
# NGINX STATUS (if enabled)
# =============================================================================

location /nginx/status {
    # Enable stub_status for basic nginx metrics
    # Note: This should be restricted to internal networks
    
    stub_status on;
    
    # Restrict access to internal IPs only
    # allow 10.0.0.0/8;
    # allow 172.16.0.0/12;
    # allow 192.168.0.0/16;
    # deny all;
    
    access_log off;
}

# =============================================================================
# APPLICATION-SPECIFIC HEALTH CHECKS
# =============================================================================

# Laravel health check route
location /health/laravel {
    access_log off;
    
    # This should point to a Laravel health check endpoint
    # The application should return 200 if healthy, 503 if unhealthy
    
    proxy_pass http://app_primary/health;
    
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    
    # Pass through the response
    proxy_intercept_errors on;
    
    # Custom error page for unhealthy state
    error_page 502 503 504 /50x-lb.html;
}

# Tenancy health check
location /health/tenancy {
    access_log off;
    
    return 200 '{"tenancy":"active","multi-tenant":true}';
    add_header Content-Type application/json;
}

# =============================================================================
# PROMETHEUS METRICS ENDPOINT (Optional)
# =============================================================================

location /metrics {
    access_log off;
    
    # Return nginx metrics in Prometheus format
    # This requires the nginx exporter or Prometheus module
    
    return 200 "# Nginx Load Balancer Metrics\n# Placeholder for Prometheus metrics\nginatraffic{upstream=\"app_primary\"} 1\nginatraffic{upstream=\"app_backup\"} 0";
    add_header Content-Type text/plain;
}

# =============================================================================
# ALERTING ENDPOINTS
# =============================================================================

# Prometheus alerting format
location /alerting/prometheus {
    access_log off;
    
    return 200 '[{"labels":{"alertname":"HighErrorRate","severity":"critical"},"annotations":{"summary":"High error rate detected on app_primary"}}]';
    add_header Content-Type application/json;
}

# =============================================================================
# CUSTOM ERROR PAGES FOR HEALTH CHECK FAILURES
# =============================================================================

location = /50x-lb.html {
    internal;
    
    # Custom error page for load balancer failures
    return 503 '<html><head><title>Service Unavailable</title></head><body><h1>Service Temporarily Unavailable</h1><p>The load balancer is currently routing to backup systems. Please try again shortly.</p></body></html>';
    add_header Content-Type text/html;
}

# =============================================================================
# PASSIVE HEALTH CHECK CONFIGURATION (Open Source Nginx)
# =============================================================================

# These directives are already configured in the upstream blocks in nginx.conf:
# 
# upstream app_primary {
#     server app01:9000 weight=3 max_fails=3 fail_timeout=30s;
#     server app02:9000 weight=3 max_fails=3 fail_timeout=30s;
#     server app03:9000 weight=2 max_fails=3 fail_timeout=30s;
# }
# 
# - max_fails: Number of failed requests before marking server as down
# - fail_timeout: Time to wait before retrying the failed server
# 
# Failed requests are detected when:
#   - Connection to upstream server fails
#   - Upstream server returns error (500, 502, 503, 504)
#   - Upstream server times out

# =============================================================================
# DYNAMIC RESOLUTION (Optional)
# =============================================================================

# Enable dynamic resolution of upstream servers
# This is useful for containerized environments where IPs may change

# resolver 8.8.8.8 8.8.4.4 valid=300s;
# resolver_timeout 5s;

# =============================================================================
# HEALTH CHECK SCRIPT INTEGRATION
# =============================================================================

# Execute health check scripts via Lua or njs module
# location /health/script {
#     content_by_lua_block {
#         local res = ngx.location.capture('/_health_check')
#         ngx.say(res.body)
#     }
# }

# Internal location for script-based health checks
location = /_health_check {
    internal;
    
    # This would typically call a script that checks:
    # - Database connectivity
    # - Cache availability
    # - Disk space
    # - Memory usage
    # - CPU load
    
    return 200 "OK";
}
