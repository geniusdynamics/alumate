# Nginx Security Headers Configuration
# Applied to all server blocks for production security
# These headers protect against common web vulnerabilities

# =============================================================================
# FRAME PROTECTION
# =============================================================================
# Prevent clickjacking attacks by controlling iframe embedding
add_header X-Frame-Options "SAMEORIGIN" always;

# =============================================================================
# MIME TYPE PROTECTION
# =============================================================================
# Prevent MIME type sniffing attacks
add_header X-Content-Type-Options "nosniff" always;

# =============================================================================
# XSS PROTECTION (legacy but still useful for older browsers)
# =============================================================================
# Enable XSS filter in legacy browsers
add_header X-XSS-Protection "1; mode=block" always;

# =============================================================================
# HTTP STRICT TRANSPORT SECURITY (HSTS)
# =============================================================================
# Force HTTPS connections for maximum security
# max-age=31536000 = 1 year
# includeSubDomains = applies to all subdomains
# preload = allows inclusion in browser HSTS preload lists
#
# IMPORTANT: Only enable after SSL is properly configured and tested!
# Start with a lower max-age (e.g., 300) for testing, then increase.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

# =============================================================================
# CONTENT SECURITY POLICY (CSP)
# =============================================================================
# Control which resources can be loaded and from where
# Adjust based on your application's specific needs
#
# default-src 'self' = only load from same origin by default
# script-src 'self' 'unsafe-inline' = allow inline scripts from self
# style-src 'self' 'unsafe-inline' = allow inline styles from self
# img-src 'self' data: https: = allow images from self, data URIs, and HTTPS
# font-src 'self' = allow fonts from same origin
# connect-src 'self' = allow AJAX/WebSocket to same origin
# frame-ancestors 'self' = control embedding in iframes
add_header Content-Security-Policy "
    default-src 'self';
    script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.example.com;
    style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
    img-src 'self' data: https:;
    font-src 'self' https://fonts.gstatic.com;
    connect-src 'self' https://api.example.com;
    frame-ancestors 'self';
    form-action 'self';
    base-uri 'self';
" always;

# =============================================================================
# REFERRER POLICY
# =============================================================================
# Control how much referrer information is sent with requests
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# =============================================================================
# PERMISSIONS POLICY
# =============================================================================
# Control which browser features can be used
# Disable sensitive features that aren't needed
add_header Permissions-Policy "
    accelerometer=(),
    camera=(),
    geolocation=(),
    gyroscope=(),
    magnetometer=(),
    microphone=(),
    payment=(),
    usb=(),
    fullscreen=(self)
" always;

# =============================================================================
# CROSS-ORIGIN POLICIES
# =============================================================================
# Cross-Origin Opener Policy - isolates browsing context
add_header Cross-Origin-Opener-Policy "same-origin" always;

# Cross-Origin Embedder Policy - requires resources to be CORS-enabled
add_header Cross-Origin-Embedder-Policy "require-corp" always;

# Cross-Origin Resource Sharing
add_header Cross-Origin-Resource-Policy "same-origin" always;

# =============================================================================
# CACHE CONTROL FOR SENSITIVE PATHS
# =============================================================================
# Disable caching for admin and private API endpoints
location ~* /admin|/api/(?!public) {
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
}

# =============================================================================
# INFORMATION LEAKAGE PREVENTION
# =============================================================================
# Hide nginx version in error pages and headers
server_tokens off;
server_name_in_redirect off;

# Remove server header entirely (requires nginxplus or custom build)
# add_header Server "nginx" always;

# =============================================================================
# LEGACY BROWSER COMPATIBILITY HEADERS
# =============================================================================
# Clear-Site-Data - clear cached data on logout (uncomment if needed)
# add_header Clear-Site-Data "cache" always;

# =============================================================================
# CUSTOM SECURITY HEADERS FOR SPECIFIC ENDPOINTS
# =============================================================================
# API responses should not be cached
location /api/ {
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
    add_header Pragma "no-cache" always;
}

# =============================================================================
# STATIC ASSETS OPTIMIZATION
# =============================================================================
# Static assets can be cached longer
location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
    add_header Cache-Control "public, immutable" always;
}
