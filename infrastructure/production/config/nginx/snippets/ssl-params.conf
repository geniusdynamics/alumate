# Nginx SSL/TLS Parameters Configuration
# Applied to HTTPS server blocks for secure connections
# Based on Mozilla Intermediate recommendations (compatible with most modern clients)

# =============================================================================
# SSL CERTIFICATE CONFIGURATION
# =============================================================================
# Update these paths for your certificates
# For Let's Encrypt: /etc/letsencrypt/live/yourdomain.com/
# For custom CA: /etc/ssl/certs/ and /etc/ssl/private/

ssl_certificate /etc/letsencrypt/live/alumni-platform.com/fullchain.pem;
ssl_certificate_key /etc/letsencrypt/live/alumni-platform.com/privkey.pem;
ssl_trusted_certificate /etc/letsencrypt/live/alumni-platform.com/chain.pem;

# =============================================================================
# TLS PROTOCOL CONFIGURATION
# =============================================================================
# Only enable TLS 1.2 and TLS 1.3 for maximum security
# TLS 1.0 and 1.1 are deprecated and vulnerable
ssl_protocols TLSv1.2 TLSv1.3;

# =============================================================================
# CIPHER SUITE CONFIGURATION
# =============================================================================
# Modern cipher suites - Mozilla Intermediate recommendations
# Prioritizes forward secrecy and strong encryption
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;

# Use server-side cipher preference (allows better security negotiation)
ssl_prefer_server_ciphers off;

# =============================================================================
# ELLIPTIC CURVE CONFIGURATION
# =============================================================================
# Use strong elliptic curves for ECDHE key exchange
ssl_ecdh_curve secp384r1:X25519:prime256v1;

# =============================================================================
# SSL SESSION CONFIGURATION
# =============================================================================
# Session cache and timeout for connection reuse
ssl_session_timeout 1d;
ssl_session_cache shared:SSL:50m;
ssl_session_tickets off;

# =============================================================================
# OCSP STAPLING
# =============================================================================
# Enable OCSP stapling for faster certificate validation
ssl_stapling on;
ssl_stapling_verify on;

# Use Cloudflare DNS resolver for OCSP queries (fast and reliable)
resolver 1.1.1.1 8.8.8.8 9.9.9.9 valid=300s;
resolver_timeout 5s;

# =============================================================================
# DIFFIE-HELLMAN PARAMETERS
# =============================================================================
# Generate with: openssl dhparam -out /etc/nginx/dhparam.pem 4096
# For maximum security, use 4096 bits (slower) or 2048 bits (faster)
ssl_dhparam /etc/nginx/dhparam.pem;

# =============================================================================
# HSTS CONFIGURATION (already in security-headers.conf, duplicated here for clarity)
# =============================================================================
# Enable HSTS with long max-age after SSL is verified
# Strict-Transport-Security: max-age=31536000; includeSubDomains; preload

# =============================================================================
# SSL COMPRESSION
# =============================================================================
# Disabled by default (CRIME attack prevention)
# nginx disables compression by default for SSL connections

# =============================================================================
# TLS 1.3 FEATURES
# =============================================================================
# Enable 0-RTT (Zero Round Trip Time) for TLS 1.3 connections
# WARNING: Only enable for idempotent requests (GET/HEAD)
# ssl_early_data on;

# =============================================================================
# ADDITIONAL SECURITY SETTINGS
# =============================================================================
# Limit SSL buffer size for better memory efficiency
ssl_buffer_size 4k;

# =============================================================================
# RENEWAL CONFIGURATION
# =============================================================================
# ACME challenge location (already in default.conf)
# Well-known directory is mounted from /var/www/letsencrypt
