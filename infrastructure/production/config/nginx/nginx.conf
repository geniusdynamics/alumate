# Nginx Production Configuration for Alumate Platform
# Configured for high performance, security, and load balancing

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

# Load dynamic modules
include /etc/nginx/modules/*.conf;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    # =============================================================================
    # BASIC SETTINGS
    # =============================================================================
    charset utf-8;
    default_type application/octet-stream;
    client_max_body_size 20m;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    types_hash_bucket_size 64;
    server_names_hash_bucket_size 64;
    server_names_hash_max_size 512;

    # =============================================================================
    # LOGGING FORMAT
    # =============================================================================
    # Detailed logging for debugging and monitoring
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    '"$host" sn="$server_name" '
                    'rt=$request_time '
                    'ua="$upstream_addr" us="$upstream_status" '
                    'ut="$upstream_response_time" ul=$upstream_response_length '
                    'cs=$upstream_cache_status';

    # Load balancer specific logging
    log_format lb '$remote_addr [$time_local] "$request" '
                  '$status upstream_addr=$upstream_addr '
                  'upstream_status=$upstream_status '
                  'request_time=$request_time';

    access_log /var/log/nginx/access.log main;

    # =============================================================================
    # MIME TYPES
    # =============================================================================
    include /etc/nginx/mime.types;

    # =============================================================================
    # GZIP COMPRESSION
    # =============================================================================
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        application/xml
        application/x-javascript
        application/xhtml+xml
        application/xslt+xml
        image/svg+xml;

    # =============================================================================
    # RATE LIMITING
    # =============================================================================
    # PHP requests rate limit (stricter)
    limit_req_zone $binary_remote_addr zone=php:10m rate=10r/s;
    
    # API requests rate limit (more permissive)
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

    # Connection limit per IP
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # Overall request limit
    limit_req_zone $binary_remote_addr zone=general:10m rate=100r/s;

    # =============================================================================
    # SECURITY - Include security headers snippet
    # =============================================================================
    include /etc/nginx/snippets/security-headers.conf;

    # =============================================================================
    # LOAD BALANCING CONFIGURATION
    # =============================================================================
    # Primary application load balancer (multiple PHP-FPM instances)
    upstream app_primary {
        # Weighted round-robin for distributed traffic
        server app01:9000 weight=3 max_fails=3 fail_timeout=30s;
        server app02:9000 weight=3 max_fails=3 fail_timeout=30s;
        server app03:9000 weight=2 max_fails=3 fail_timeout=30s;
        
        # Keep connections alive for better performance
        keepalive 64;
    }
    
    # Secondary/Backup load balancer (for failover)
    upstream app_backup {
        server backup01:9000 weight=1 backup;
        server backup02:9000 weight=1 backup;
        
        keepalive 16;
    }
    
    # Session-aware load balancer (for authenticated routes)
    upstream app_sessions {
        # Use IP hash for session persistence
        ip_hash;
        
        server app01:9000 weight=3;
        server app02:9000 weight=3;
        server app03:9000 weight=2;
        
        keepalive 64;
    }
    
    # WebSocket load balancer with sticky sessions
    upstream websocket_backend {
        # WebSocket connections require sticky session
        ip_hash;
        
        server websocket01:8080 weight=2;
        server websocket02:8080 weight=2;
        server websocket03:8080 weight=1;
        
        keepalive 32;
    }
    
    # Analytics load balancer (isolated for analytics workloads)
    upstream analytics_backend {
        server analytics01:9001 weight=2;
        server analytics02:9001 weight=2;
        server analytics03:9001 weight=1;
        
        keepalive 32;
    }
    
    # Legacy PHP-FPM backend (single server for backward compatibility)
    upstream php_backend {
        server app:9000;
        keepalive 32;
    }

    # =============================================================================
    # UPSTREAM TIMEOUTS AND BUFFERING
    # =============================================================================
    # Default upstream settings
    upstream_keepalive_requests 1000;
    upstream_keepalive_timeout 60s;
    upstream_connect_timeout 5s;
    upstream_send_timeout 60s;
    upstream_read_timeout 60s;

    # =============================================================================
    # INCLUDE CONFIGURATION FILES
    # =============================================================================
    include /etc/nginx/conf.d/*.conf;
    include /etc/nginx/conf.d/load-balancer.conf;
    include /etc/nginx/conf.d/health-checks.conf;
    include /etc/nginx/conf.d/failover.conf;

    # =============================================================================
    # DEFAULT SERVER BLOCK (catch-all for unknown hosts)
    # =============================================================================
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        return 444;  # Close connection without response
    }
}
