apiVersion: apps/v1
kind: Deployment
metadata:
  name: alumni-platform-app
  labels:
    app: alumni-platform
    component: web
    service: alumni
spec:
  replicas: 3
  selector:
    matchLabels:
      app: alumni-platform
      component: web
  template:
    metadata:
      labels:
        app: alumni-platform
        component: web
        service: alumni
    spec:
      containers:
      - name: alumni-platform-web
        image: alumni-platform:latest
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: APP_ENV
          value: "production"
        - name: APP_NAME
          value: "Alumni Platform"
        - name: CACHE_STORE
          value: "redis"
        - name: REDIS_HOST
          value: "redis-cluster"
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: redis-secret
              key: password
        - name: DB_CONNECTION
          value: "pgsql"
        - name: DB_HOST
          value: "postgres-service"
        - name: DB_PORT
          value: "5432"
        - name: DB_DATABASE
          valueFrom:
            secretKeyRef:
              name: db-secret
              key: database
        - name: DB_USERNAME
          valueFrom:
            secretKeyRef:
              name: db-secret
              key: username
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-secret
              key: password
        - name: OCTANE_SERVER
          value: "swoole"
        - name: OCTANE_HOST
          value: "0.0.0.0"
        - name: OCTANE_PORT
          value: "8000"
        - name: NEW_RELIC_APP_NAME
          value: "Alumni Platform Production"
        - name: NEW_RELIC_LICENSE_KEY
          valueFrom:
            secretKeyRef:
              name: newrelic-secret
              key: license_key
        - name: SENTRY_LARAVEL_DSN
          valueFrom:
            secretKeyRef:
              name: sentry-secret
              key: dsn
        resources:
          requests:
            memory: "2Gi"
            cpu: "2000m"
          limits:
            memory: "2Gi"
            cpu: "2000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 30
        volumeMounts:
        - name: storage
          mountPath: /var/www/html/storage
       - name: redis-sidecar
         image: redis:7-alpine
         ports:
         - containerPort: 6379
           name: redis
         env:
         - name: REDIS_PASSWORD
           valueFrom:
             secretKeyRef:
               name: redis-secret
               key: password
         resources:
           requests:
             memory: "256Mi"
             cpu: "100m"
           limits:
             memory: "512Mi"
             cpu: "200m"
         volumeMounts:
         - name: redis-data
           mountPath: /data
      volumes:
      - name: storage
        persistentVolumeClaim:
          claimName: alumni-platform-storage-pvc
       volumes:
       - name: storage
         persistentVolumeClaim:
           claimName: alumni-platform-storage-pvc
       - name: redis-data
         persistentVolumeClaim:
           claimName: redis-data-pvc
---
