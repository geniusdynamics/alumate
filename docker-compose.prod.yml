version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: infrastructure/production/Dockerfile.php
    container_name: alumate-app
    environment:
      - APP_ENV=production
      - DB_HOST=pgsql
      - REDIS_HOST=redis
      - QUEUE_CONNECTION=redis
    volumes:
      - ./storage:/var/www/html/storage
    depends_on:
      - pgsql
      - redis
    networks:
      - alumate-network

  pgsql:
    image: postgres:17
    container_name: alumate-pgsql
    environment:
      - POSTGRES_DB=analytics_prod
      - POSTGRES_USER=prod_user
      - POSTGRES_PASSWORD=prod_password
    volumes:
      - pgsql_data:/var/lib/postgresql/data
      - ./backups:/backups
    ports:
      - "5432:5432"
    networks:
      - alumate-network

  redis:
    image: redis:7-alpine
    container_name: alumate-redis
    volumes:
      - redis_data:/data
      - ./backups:/backups
    ports:
      - "6379:6379"
    networks:
      - alumate-network

  horizon:
    build:
      context: .
      dockerfile: infrastructure/production/Dockerfile.php
    container_name: alumate-horizon
    command: php artisan horizon
    environment:
      - APP_ENV=production
      - DB_HOST=pgsql
      - REDIS_HOST=redis
      - QUEUE_CONNECTION=redis
    depends_on:
      - pgsql
      - redis
    networks:
      - alumate-network

volumes:
  pgsql_data:
  redis_data:

networks:
  alumate-network:
    driver: bridge