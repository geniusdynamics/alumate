name: Homepage Production Deployment

on:
  push:
    branches: [main]
    paths:
      - 'resources/js/Pages/Homepage/**'
      - 'resources/js/Components/Homepage/**'
      - 'app/Http/Controllers/HomepageController.php'
      - 'app/Services/Homepage/**'
      - 'routes/web.php'
      - 'database/migrations/*homepage*'
  workflow_dispatch:
    inputs:
      confirm_deployment:
        description: 'Type "deploy" to confirm'
        required: true
        type: string

env:
  NODE_VERSION: '22'
  PHP_VERSION: '8.3'

jobs:
  validate-deployment:
    name: Validate Deployment
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.confirm_deployment == 'deploy'
    steps:
      - name: Confirm deployment
        run: echo "✅ Deployment confirmed"

  test:
    name: Test Homepage
    runs-on: ubuntu-latest
    needs: [validate-deployment]
    if: always() && (needs.validate-deployment.result == 'success' || needs.validate-deployment.result == 'skipped')
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite
          tools: composer:v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install PHP dependencies
        run: composer install --no-dev --optimize-autoloader

      - name: Install Node dependencies
        run: npm ci

      - name: Create environment file
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: TypeScript Type Check
        run: npx vue-tsc --noEmit

      - name: Run PHP tests
        run: php artisan test --filter=Homepage

      - name: Run JavaScript tests
        run: npm run test:homepage --run

      - name: Build assets
        run: npm run build

      - name: Run deployment verification tests
        run: php artisan test tests/Feature/DeploymentVerificationTest.php

  deploy:
    name: Deploy Homepage
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          tools: composer:v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: |
          composer install --no-dev --optimize-autoloader
          npm ci

      - name: TypeScript Type Check
        run: npx vue-tsc --noEmit

      - name: Build production assets
        run: npm run build

      - name: Deploy to production
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          echo "$DEPLOY_KEY" > deploy_key
          chmod 600 deploy_key

          # Create deployment package
          tar -czf homepage-deployment.tar.gz \
            --exclude=node_modules \
            --exclude=.git \
            --exclude=tests \
            --exclude=storage/logs \
            public/build \
            app/Http/Controllers/HomepageController.php \
            app/Services/Homepage \
            resources/js/Pages/Homepage \
            resources/js/Components/Homepage \
            database/migrations \
            routes/web.php \
            composer.json \
            composer.lock \
            package.json \
            package-lock.json
            
          # Deploy to server
          scp -i deploy_key -o StrictHostKeyChecking=no \
            homepage-deployment.tar.gz \
            scripts/deploy-homepage.sh \
            $DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/
            
          ssh -i deploy_key -o StrictHostKeyChecking=no \
            $DEPLOY_USER@$DEPLOY_HOST \
            "cd $DEPLOY_PATH && bash deploy-homepage.sh"

      - name: Verify deployment
        env:
          PRODUCTION_URL: ${{ secrets.PRODUCTION_URL }}
        run: |
          MAX_RETRIES=20
          RETRY_INTERVAL=5
          URL="$PRODUCTION_URL/health-check/homepage"

          for i in $(seq 1 $MAX_RETRIES); do
            echo "Health check attempt $i/$MAX_RETRIES..."
            if curl -sf --max-time 10 "$URL"; then
              echo "✅ Homepage deployment verified"
              exit 0
            fi
            echo "Health check failed, retrying in ${RETRY_INTERVAL}s..."
            sleep $RETRY_INTERVAL
          done

          echo "❌ Homepage deployment verification failed"
          exit 1

      - name: Run smoke tests
        run: |
          npm run test:smoke --run
