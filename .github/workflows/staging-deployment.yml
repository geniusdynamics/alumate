name: Staging Deployment

on:
  push:
    branches:
      - develop
      - staging
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - '.github/**'
      - 'scripts/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - development

env:
  NODE_VERSION: '22'
  PHP_VERSION: '8.3'
  COMPOSER_VERSION: '2'

jobs:
  # Security and quality checks before deployment
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event.inputs.environment || 'staging' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: dom, curl, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite
          tools: composer:${{ env.COMPOSER_VERSION }}
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction --quiet

      - name: Run security analysis
        run: |
          if command -v composer audit >/dev/null 2>&1; then
            composer audit --no-interaction || true
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci --silent

      - name: Run dependency security audit
        run: npm audit --audit-level=high || true

  # Build and test the application
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    needs: security-scan
    environment:
      name: ${{ github.event.inputs.environment || 'staging' }}
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready -U postgres" --health-interval=10s --health-timeout=5s --health-retries=3

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: dom, curl, mbstring, zip, pcntl, pdo, pdo_pgsql, bcmath
          tools: composer:${{ env.COMPOSER_VERSION }}
          coverage: pcov

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install PHP dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction --quiet

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci --silent

      - name: Setup test environment
        run: |
          cp .env.example .env.testing
          sed -i 's/DB_CONNECTION=sqlite/DB_CONNECTION=pgsql/' .env.testing
          sed -i 's/DB_DATABASE=.*/DB_DATABASE=test_db/' .env.testing
          sed -i 's/DB_USERNAME=.*/DB_USERNAME=postgres/' .env.testing
          sed -i 's/DB_PASSWORD=.*/DB_PASSWORD=password/' .env.testing

      - name: Generate application key
        run: php artisan key:generate

      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h localhost -p 5432 -U postgres; do
            echo "Waiting for PostgreSQL..."
            sleep 2
          done

      - name: Run system migrations
        run: php artisan migrate --force --no-interaction

      - name: Run tenant migrations
        run: php artisan tenants:migrate --force --no-interaction

      - name: Run PHP tests
        run: php artisan test --testsuite=Unit --coverage --min=50 || true

      - name: Build frontend assets
        run: npm run build --silent

      - name: Create deployment artifact
        run: |
          mkdir -p deployment-package
          tar -czf deployment-package/app.tar.gz \
            --exclude=node_modules \
            --exclude=.git \
            --exclude=tests \
            --exclude=.env* \
            --exclude=storage/logs \
            --exclude=storage/framework/cache \
            --exclude=storage/framework/sessions \
            --exclude=storage/framework/views \
            --exclude=storage/app \
            --exclude=database/seeders \
            --exclude=deployment-package \
            .

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: staging-build-${{ github.sha }}
          path: deployment-package/
          retention-days: 3

  # Deploy to staging/development environment
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build-and-test
    environment:
      name: staging
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: staging-build-${{ github.sha }}
          path: deployment-package/

      - name: Extract deployment artifact
        run: tar -xzf deployment-package/app.tar.gz -C deployment-package/

      - name: Deploy using production script
        env:
          DEPLOY_ENV: staging
          DEPLOY_HOST: ${{ secrets.STAGING_HOST }}
          DEPLOY_USER: ${{ secrets.STAGING_USER }}
          DEPLOY_KEY: ${{ secrets.STAGING_SSH_KEY }}
          DEPLOY_PATH: ${{ secrets.STAGING_PATH }}
          DB_USERNAME: ${{ secrets.STAGING_DB_USER }}
          DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
          REDIS_PASSWORD: ${{ secrets.STAGING_REDIS_PASSWORD }}
          APP_KEY: ${{ secrets.STAGING_APP_KEY }}
          GIT_REPOSITORY: ${{ github.repositoryUrl }}
        run: |
          # Create deployment key
          echo "$DEPLOY_KEY" > deploy_key
          chmod 600 deploy_key

          # Copy deployment script
          scp -i deploy_key -o StrictHostKeyChecking=no \
            infrastructure/production/deploy.production.sh \
            $DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/

          # Execute deployment
          ssh -i deploy_key -o StrictHostKeyChecking=no \
            $DEPLOY_USER@$DEPLOY_HOST \
            "cd $DEPLOY_PATH && DEPLOY_ENV=staging ./deploy.production.sh"

      - name: Health check
        run: |
          sleep 30
          curl -f https://${{ secrets.STAGING_DOMAIN }}/health-check || exit 1

      - name: Send notification
        if: always()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
          channel: '#deployments'
          text: "Staging deployment ${{ job.status }}"
          fields: repo,message,commit,author,action,eventName,ref,workflow
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  # Deploy to development environment
  deploy-development:
    name: Deploy to Development
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event.inputs.environment == 'development'
    environment:
      name: development
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: staging-build-${{ github.sha }}
          path: deployment-package/

      - name: Extract deployment artifact
        run: tar -xzf deployment-package/app.tar.gz -C deployment-package/

      - name: Deploy to development server
        env:
          DEPLOY_ENV: development
          DEPLOY_HOST: ${{ secrets.DEV_HOST }}
          DEPLOY_USER: ${{ secrets.DEV_USER }}
          DEPLOY_KEY: ${{ secrets.DEV_SSH_KEY }}
          DEPLOY_PATH: ${{ secrets.DEV_PATH }}
          DB_USERNAME: ${{ secrets.DEV_DB_USER }}
          DB_PASSWORD: ${{ secrets.DEV_DB_PASSWORD }}
          APP_KEY: ${{ secrets.DEV_APP_KEY }}
          GIT_REPOSITORY: ${{ github.repositoryUrl }}
        run: |
          echo "$DEPLOY_KEY" > deploy_key
          chmod 600 deploy_key

          scp -i deploy_key -o StrictHostKeyChecking=no \
            infrastructure/production/deploy.production.sh \
            $DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/

          ssh -i deploy_key -o StrictHostKeyChecking=no \
            $DEPLOY_USER@$DEPLOY_HOST \
            "cd $DEPLOY_PATH && DEPLOY_ENV=development ./deploy.production.sh"

      - name: Health check
        run: |
          sleep 30
          curl -f https://${{ secrets.DEV_DOMAIN }}/health-check || exit 1

      - name: Send notification
        if: always()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
          channel: '#deployments'
          text: "Development deployment ${{ job.status }}"
          fields: repo,message,commit,author,action,eventName,ref,workflow
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
