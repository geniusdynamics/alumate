name: CI

on:
  push:
    branches:
      - develop
      - main
      - db
  pull_request:
    branches:
      - develop
      - main
      - db

env:
  PHP_VERSION: '8.3'
  NODE_VERSION: '22'

jobs:
  lint-and-format:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: dom, curl, mbstring, zip, pcntl
          tools: composer:v2

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Run PHP Linting (Pint)
        run: vendor/bin/pint

      - name: Run JS Linting (ESLint)
        run: npm run lint

      - name: TypeScript Type Check
        run: npx vue-tsc --noEmit

  unit-tests:
    name: Unit Tests (SQLite)
    runs-on: ubuntu-latest
    needs: lint-and-format
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: dom, curl, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite
          tools: composer:v2
          coverage: xdebug

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Setup Environment
        run: |
          cp .env.example .env
          touch database/database.sqlite

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Run Unit Tests Only (SQLite)
        run: |
          php artisan config:clear
          ./vendor/bin/pest --parallel --testsuite=Unit --coverage --coverage-clover=tests/reports/coverage.unit.xml --coverage-html=tests/reports/coverage-html.unit --coverage-text=tests/reports/coverage.unit.txt

      - name: Upload Unit Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-unit
          path: |
            tests/reports/coverage.unit.xml
            tests/reports/coverage.unit.txt
          retention-days: 14

      - name: Upload Unit Coverage HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html-unit
          path: tests/reports/coverage-html.unit
          retention-days: 14

      - name: Check Coverage Threshold
        run: |
          COVERAGE=$(grep -oP '\d+(\.\d+)?%' tests/reports/coverage.unit.txt | head -1 | tr -d '%')
          if (( $(echo "$COVERAGE < 80" | bc -l) )); then
            echo "❌ Code coverage ($COVERAGE%) is below minimum threshold (80%)"
            exit 1
          fi
          echo "✅ Code coverage ($COVERAGE%) meets minimum threshold (80%)"

  unit-tests-pgsql:
    name: Unit Tests (PostgreSQL)
    runs-on: ubuntu-latest
    needs: lint-and-format
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready -U postgres" --health-interval=10s --health-timeout=5s --health-retries=3

      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: dom, curl, mbstring, zip, pcntl, pdo, pdo_pgsql
          tools: composer:v2
          coverage: xdebug

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Setup Environment
        run: |
          cp .env.example .env
          sed -i 's/DB_CONNECTION=sqlite/DB_CONNECTION=pgsql/' .env
          sed -i 's/DB_DATABASE=database\/database.sqlite/DB_DATABASE=test_db/' .env
          sed -i 's/DB_USERNAME=root/DB_USERNAME=postgres/' .env
          sed -i 's/DB_PASSWORD=/DB_PASSWORD=password/' .env
          sed -i 's/DB_HOST=127.0.0.1/DB_HOST=localhost/' .env
          sed -i 's/DB_PORT=3306/DB_PORT=5432/' .env

      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h localhost -p 5432 -U postgres; do
            echo "Waiting for PostgreSQL..."
            sleep 2
          done
          echo "PostgreSQL is ready!"

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Run Unit Tests (PostgreSQL)
        run: |
          php artisan config:clear
          ./vendor/bin/pest --parallel --testsuite=Unit --configuration=phpunit.pgsql.xml --coverage --coverage-clover=tests/reports/coverage.unit.pgsql.xml --coverage-html=tests/reports/coverage-html.unit.pgsql --coverage-text=tests/reports/coverage.unit.pgsql.txt

      - name: Upload Unit Test Reports (PostgreSQL)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-unit-pgsql
          path: |
            tests/reports/coverage.unit.pgsql.xml
            tests/reports/coverage.unit.pgsql.txt
          retention-days: 14

      - name: Upload Unit Coverage HTML (PostgreSQL)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html-unit-pgsql
          path: tests/reports/coverage-html.unit.pgsql
          retention-days: 14

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready -U postgres" --health-interval=10s --health-timeout=5s --health-retries=3

      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: dom, curl, mbstring, zip, pcntl, pdo, pdo_pgsql
          tools: composer:v2
          coverage: xdebug

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Setup Environment
        run: |
          cp .env.example .env
          sed -i 's/DB_CONNECTION=sqlite/DB_CONNECTION=pgsql/' .env
          sed -i 's/DB_DATABASE=database\/database.sqlite/DB_DATABASE=test_db/' .env
          sed -i 's/DB_USERNAME=root/DB_USERNAME=postgres/' .env
          sed -i 's/DB_PASSWORD=/DB_PASSWORD=password/' .env
          sed -i 's/DB_HOST=127.0.0.1/DB_HOST=localhost/' .env
          sed -i 's/DB_PORT=3306/DB_PORT=5432/' .env

      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h localhost -p 5432 -U postgres; do
            echo "Waiting for PostgreSQL..."
            sleep 2
          done
          echo "PostgreSQL is ready!"

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Run Migrations
        run: php artisan migrate --force

      - name: Run Tenant Migrations
        run: php artisan tenants:migrate --force

      - name: Run Integration Tests Only
        run: |
          php artisan config:clear
          ./vendor/bin/pest --parallel --testsuite=Integration --coverage --coverage-clover=tests/reports/coverage.integration.xml --coverage-html=tests/reports/coverage-html.integration --coverage-text=tests/reports/coverage.integration.txt

      - name: Upload Integration Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-integration
          path: |
            tests/reports/coverage.integration.xml
            tests/reports/coverage.integration.txt
          retention-days: 14

      - name: Upload Integration Coverage HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html-integration
          path: tests/reports/coverage-html.integration
          retention-days: 14

  feature-tests:
    name: Feature Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready -U postgres" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: dom, curl, mbstring, zip, pcntl, pdo, pdo_pgsql
          tools: composer:v2
          coverage: xdebug

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Setup Environment
        run: |
          cp .env.example .env
          sed -i 's/DB_CONNECTION=sqlite/DB_CONNECTION=pgsql/' .env
          sed -i 's/DB_DATABASE=database\/database.sqlite/DB_DATABASE=test_db/' .env
          sed -i 's/DB_USERNAME=root/DB_USERNAME=postgres/' .env
          sed -i 's/DB_PASSWORD=/DB_PASSWORD=password/' .env
          sed -i 's/DB_HOST=127.0.0.1/DB_HOST=localhost/' .env
          sed -i 's/DB_PORT=3306/DB_PORT=5432/' .env

      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h localhost -p 5432 -U postgres; do
            echo "Waiting for PostgreSQL..."
            sleep 2
          done
          echo "PostgreSQL is ready!"

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Run Migrations
        run: php artisan migrate --force

      - name: Run Feature Tests Only
        run: |
          php artisan config:clear
          ./vendor/bin/pest --parallel --testsuite=Feature --coverage --coverage-clover=tests/reports/coverage.feature.xml --coverage-html=tests/reports/coverage-html.feature --coverage-text=tests/reports/coverage.feature.txt

      - name: Upload Feature Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-feature
          path: |
            tests/reports/coverage.feature.xml
            tests/reports/coverage.feature.txt
          retention-days: 14

      - name: Upload Feature Coverage HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html-feature
          path: tests/reports/coverage-html.feature
          retention-days: 14

  full-tests-pgsql:
    name: Full Tests (PostgreSQL)
    runs-on: ubuntu-latest
    needs: [integration-tests, feature-tests]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready -U postgres" --health-interval=10s --health-timeout=5s --health-retries=3

      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: dom, curl, mbstring, zip, pcntl, pdo, pdo_pgsql
          tools: composer:v2
          coverage: xdebug

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Setup Environment
        run: |
          cp .env.example .env
          sed -i 's/DB_CONNECTION=sqlite/DB_CONNECTION=pgsql/' .env
          sed -i 's/DB_DATABASE=database\/database.sqlite/DB_DATABASE=test_db/' .env
          sed -i 's/DB_USERNAME=root/DB_USERNAME=postgres/' .env
          sed -i 's/DB_PASSWORD=/DB_PASSWORD=password/' .env
          sed -i 's/DB_HOST=127.0.0.1/DB_HOST=localhost/' .env
          sed -i 's/DB_PORT=3306/DB_PORT=5432/' .env

      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h localhost -p 5432 -U postgres; do
            echo "Waiting for PostgreSQL..."
            sleep 2
          done
          echo "PostgreSQL is ready!"

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Run Migrations
        run: php artisan migrate --force

      - name: Run Tenant Migrations
        run: php artisan tenants:migrate --force

      - name: Run Full Test Suite (PostgreSQL)
        run: |
          php artisan config:clear
          ./vendor/bin/pest --parallel --configuration=phpunit.pgsql.xml --coverage --coverage-clover=tests/reports/coverage.full.pgsql.xml --coverage-html=tests/reports/coverage-html.full.pgsql --coverage-text=tests/reports/coverage.full.pgsql.txt

      - name: Upload Full Test Reports (PostgreSQL)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-full-pgsql
          path: |
            tests/reports/coverage.full.pgsql.xml
            tests/reports/coverage.full.pgsql.txt
          retention-days: 14

      - name: Upload Full Coverage HTML (PostgreSQL)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html-full-pgsql
          path: tests/reports/coverage-html.full.pgsql
          retention-days: 14

  frontend-tests:
    name: Frontend Tests & Build
    runs-on: ubuntu-latest
    needs: lint-and-format
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: dom, curl, mbstring, zip, pcntl
          tools: composer:v2

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Generate Ziggy Routes
        run: |
          php artisan ziggy:generate
        env:
          APP_KEY: base64:placeholder-key-for-frontend-build

      - name: TypeScript Type Check
        run: npx vue-tsc --noEmit

      - name: Run Frontend Tests (Vitest)
        run: npm test

      - name: Build Frontend Assets
        run: npm run build

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: public/build/
          retention-days: 7

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: lint-and-format
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: dom, curl, mbstring, zip, pcntl
          tools: composer:v2

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Run Composer Audit
        run: composer audit --no-interaction
        continue-on-error: false

      - name: Run npm Audit
        run: npm audit --audit-level=high
        continue-on-error: false

  notify-completion:
    name: Notify Completion
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, feature-tests, frontend-tests, full-tests-pgsql, security-audit]
    if: always()
    steps:
      - name: Test Summary
        run: |
          echo "CI Pipeline completed"
          echo "Unit Tests: ${{ needs.unit-tests.result }}"
          echo "Integration Tests: ${{ needs.integration-tests.result }}"
          echo "Feature Tests: ${{ needs.feature-tests.result }}"
          echo "Frontend Tests: ${{ needs.frontend-tests.result }}"
          echo "Full Tests: ${{ needs.full-tests-pgsql.result }}"
          echo "Security Audit: ${{ needs.security-audit.result }}"

      - name: Check for failures
        run: |
          if [[ "${{ needs.unit-tests.result }}" == "failure" ]] || \
             [[ "${{ needs.integration-tests.result }}" == "failure" ]] || \
             [[ "${{ needs.feature-tests.result }}" == "failure" ]] || \
             [[ "${{ needs.frontend-tests.result }}" == "failure" ]] || \
             [[ "${{ needs.full-tests-pgsql.result }}" == "failure" ]] || \
             [[ "${{ needs.security-audit.result }}" == "failure" ]]; then
            echo "❌ One or more jobs failed"
            exit 1
          fi
          echo "✅ All jobs passed successfully"
