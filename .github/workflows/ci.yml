name: CI

on:
  push:
    branches:
      - develop
      - main
      - db
  pull_request:
    branches:
      - develop
      - main
      - db
  schedule:
    # Run security scans daily at 2 AM UTC
    - cron: '0 2 * * *'

env:
  PHP_VERSION: '8.3'
  NODE_VERSION: '22'

jobs:
  lint-and-format:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: dom, curl, mbstring, zip, pcntl
          tools: composer:v2

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Run PHP Linting (Pint)
        run: vendor/bin/pint

      - name: Run JS Linting (ESLint)
        run: pnpm run lint

      - name: TypeScript Type Check
        run: npx vue-tsc --noEmit

      - name: Check PHPStan Static Analysis
        run: ./vendor/bin/phpstan analyse --level=5 --no-progress || true

      - name: Check for Strict Types Declarations
        run: |
          STRICT_COUNT=$(grep -r "^declare(strict_types=1)" app/ 2>/dev/null | wc -l)
          TOTAL_FILES=$(find app -name "*.php" | wc -l)
          echo "Files with strict_types: $STRICT_COUNT / $TOTAL_FILES"
          if [ $STRICT_COUNT -lt $((TOTAL_FILES / 2)) ]; then
            echo "⚠️ Warning: Less than 50% of files have strict_types declaration"
          fi

  unit-tests:
    name: Unit Tests (SQLite)
    runs-on: ubuntu-latest
    needs: lint-and-format
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: dom, curl, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite
          tools: composer:v2
          coverage: xdebug

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Setup Environment
        run: |
          cp .env.example .env
          touch database/database.sqlite

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Run Unit Tests Only (SQLite)
        run: |
          php artisan config:clear
          ./vendor/bin/pest --parallel --testsuite=Unit --coverage --coverage-clover=tests/reports/coverage.unit.xml --coverage-html=tests/reports/coverage-html.unit --coverage-text=tests/reports/coverage.unit.txt

      - name: Upload Unit Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-unit
          path: |
            tests/reports/coverage.unit.xml
            tests/reports/coverage.unit.txt
          retention-days: 14

      - name: Upload Unit Coverage HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html-unit
          path: tests/reports/coverage-html.unit
          retention-days: 14

      - name: Check Coverage Threshold
        run: |
          COVERAGE=$(grep -oP '\d+(\.\d+)?%' tests/reports/coverage.unit.txt | head -1 | tr -d '%')
          if (( $(echo "$COVERAGE < 80" | bc -l) )); then
            echo "❌ Code coverage ($COVERAGE%) is below minimum threshold (80%)"
            exit 1
          fi
          echo "✅ Code coverage ($COVERAGE%) meets minimum threshold (80%)"

  unit-tests-pgsql:
    name: Unit Tests (PostgreSQL)
    runs-on: ubuntu-latest
    needs: lint-and-format
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready -U postgres" --health-interval=10s --health-timeout=5s --health-retries=3

      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: dom, curl, mbstring, zip, pcntl, pdo, pdo_pgsql
          tools: composer:v2
          coverage: xdebug

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Setup Environment
        run: |
          cp .env.example .env
          sed -i 's/DB_CONNECTION=sqlite/DB_CONNECTION=pgsql/' .env
          sed -i 's/DB_DATABASE=database\/database.sqlite/DB_DATABASE=test_db/' .env
          sed -i 's/DB_USERNAME=root/DB_USERNAME=postgres/' .env
          sed -i 's/DB_PASSWORD=/DB_PASSWORD=password/' .env
          sed -i 's/DB_HOST=127.0.0.1/DB_HOST=localhost/' .env
          sed -i 's/DB_PORT=3306/DB_PORT=5432/' .env

      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h localhost -p 5432 -U postgres; do
            echo "Waiting for PostgreSQL..."
            sleep 2
          done
          echo "PostgreSQL is ready!"

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Run Unit Tests (PostgreSQL)
        run: |
          php artisan config:clear
          ./vendor/bin/pest --parallel --testsuite=Unit --configuration=phpunit.pgsql.xml --coverage --coverage-clover=tests/reports/coverage.unit.pgsql.xml --coverage-html=tests/reports/coverage-html.unit.pgsql --coverage-text=tests/reports/coverage.unit.pgsql.txt

      - name: Upload Unit Test Reports (PostgreSQL)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-unit-pgsql
          path: |
            tests/reports/coverage.unit.pgsql.xml
            tests/reports/coverage.unit.pgsql.txt
          retention-days: 14

      - name: Upload Unit Coverage HTML (PostgreSQL)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html-unit-pgsql
          path: tests/reports/coverage-html.unit.pgsql
          retention-days: 14

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
