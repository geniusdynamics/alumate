          sed -i 's/DB_CONNECTION=sqlite/DB_CONNECTION=pgsql/' .env
          sed -i 's/DB_DATABASE=database\/database.sqlite/DB_DATABASE=test_db/' .env
          sed -i 's/DB_USERNAME=root/DB_USERNAME=postgres/' .env
          sed -i 's/DB_PASSWORD=/DB_PASSWORD=password/' .env
          sed -i 's/DB_HOST=127.0.0.1/DB_HOST=localhost/' .env
          sed -i 's/DB_PORT=3306/DB_PORT=5432/' .env

      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h localhost -p 5432 -U postgres; do
            echo "Waiting for PostgreSQL..."
            sleep 2
          done
          echo "PostgreSQL is ready!"

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Run Migrations
        run: php artisan migrate --force

      - name: Run Tenant Migrations
        run: php artisan tenants:migrate --force

      - name: Run Full Test Suite (PostgreSQL)
        run: |
          php artisan config:clear
          ./vendor/bin/pest --parallel --configuration=phpunit.pgsql.xml --coverage --coverage-clover=tests/reports/coverage.full.pgsql.xml --coverage-html=tests/reports/coverage-html.full.pgsql --coverage-text=tests/reports/coverage.full.pgsql.txt

      - name: Upload Full Test Reports (PostgreSQL)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-full-pgsql
          path: |
            tests/reports/coverage.full.pgsql.xml
            tests/reports/coverage.full.pgsql.txt
          retention-days: 14

      - name: Upload Full Coverage HTML (PostgreSQL)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html-full-pgsql
          path: tests/reports/coverage-html.full.pgsql
          retention-days: 14

  frontend-tests:
    name: Frontend Tests & Build
    runs-on: ubuntu-latest
    needs: lint-and-format
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: dom, curl, mbstring, zip, pcntl
          tools: composer:v2

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Ziggy Routes
        run: |
          php artisan ziggy:generate
        env:
          APP_KEY: base64:placeholder-key-for-frontend-build

      - name: TypeScript Type Check
        run: pnpm exec vue-tsc --noEmit

      - name: Run Frontend Tests (Vitest)
        run: pnpm test

      - name: Build Frontend Assets
        run: pnpm run build

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: public/build/
          retention-days: 7

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: lint-and-format
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: dom, curl, mbstring, zip, pcntl
          tools: composer:v2

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Composer Audit
        run: composer audit --no-interaction
        continue-on-error: false

      - name: Run pnpm Audit
        run: pnpm audit --audit-level high
        continue-on-error: false

      - name: Check for Sensitive Data
        run: |
          echo "Checking for hardcoded credentials..."
          PATTERNS="(password|secret|api_key|apikey|token|aws_access_key_id|aws_secret_access_key)"
          MATCHES=$(grep -rEi "$PATTERNS" --include="*.php" --include="*.env*" --include="*.json" --exclude-dir=vendor --exclude-dir=node_modules --exclude="*.md" . | grep -v "env(" | grep -v "config(" | grep -v "// " | grep -v "# " | head -20 || true)
          if [ -n "$MATCHES" ]; then
            echo "⚠️ Potential hardcoded credentials found:"
            echo "$MATCHES"
            exit 1
          fi
          echo "✅ No hardcoded credentials found"

      - name: Check for .env Files
        run: |
          ENV_FILES=$(find . -name ".env*" -type f ! -path "./.env.example" ! -path "./.env.testing" ! -path "./vendor/*" ! -path "./node_modules/*" 2>/dev/null || true)
          if [ -n "$ENV_FILES" ]; then
            echo "❌ Found .env files that should not be committed:"
            echo "$ENV_FILES"
            exit 1
          fi
          echo "✅ No unauthorized .env files found"

  db-consistency:
    name: Database Consistency
    runs-on: ubuntu-latest
    needs: lint-and-format
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready -U postgres" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: dom, curl, mbstring, zip, pcntl, pdo, pdo_pgsql
          tools: composer:v2

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Setup Environment
        run: |
          cp .env.example .env
          sed -i 's/DB_CONNECTION=sqlite/DB_CONNECTION=pgsql/' .env
          sed -i 's/DB_DATABASE=database\/database.sqlite/DB_DATABASE=test_db/' .env
          sed -i 's/DB_USERNAME=root/DB_USERNAME=postgres/' .env
          sed -i 's/DB_PASSWORD=/DB_PASSWORD=password/' .env
          sed -i 's/DB_HOST=127.0.0.1/DB_HOST=localhost/' .env
          sed -i 's/DB_PORT=3306/DB_PORT=5432/' .env

      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h localhost -p 5432 -U postgres; do
            echo "Waiting for PostgreSQL..."
            sleep 2
          done
          echo "PostgreSQL is ready!"

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Run Migrations
        run: php artisan migrate --force

      - name: Run Tenant Migrations
        run: php artisan tenants:migrate --force

      - name: Check Migration Status
        run: |
          php artisan migrate:status
          php artisan tenants:migrate:status

      - name: Validate Schema
        run: |
          php artisan schema:dump
          ls -la database/schema/ || true

  notify-completion:
    name: Notify Completion
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, feature-tests, frontend-tests, full-tests-pgsql, security-audit, db-consistency]
    if: always()
    steps:
      - name: Generate Summary
        id: summary
        run: |
          echo "test_results<<EOF" >> $GITHUB_OUTPUT
          echo "CI Pipeline completed" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "Test Results:" >> $GITHUB_OUTPUT
          echo "- Unit Tests (SQLite): ${{ needs.unit-tests.result }}" >> $GITHUB_OUTPUT
          echo "- Unit Tests (PostgreSQL): ${{ needs.unit-tests-pgsql.result }}" >> $GITHUB_OUTPUT
          echo "- Integration Tests: ${{ needs.integration-tests.result }}" >> $GITHUB_OUTPUT
          echo "- Feature Tests: ${{ needs.feature-tests.result }}" >> $GITHUB_OUTPUT
          echo "- Frontend Tests: ${{ needs.frontend-tests.result }}" >> $GITHUB_OUTPUT
          echo "- Full Tests (PostgreSQL): ${{ needs.full-tests-pgsql.result }}" >> $GITHUB_OUTPUT
          echo "- Security Audit: ${{ needs.security-audit.result }}" >> $GITHUB_OUTPUT
          echo "- Database Consistency: ${{ needs.db-consistency.result }}" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Post Summary
        run: |
          echo "${{ steps.summary.outputs.test_results }}"

      - name: Check Overall Status
        run: |
          FAILED=0
          if [[ "${{ needs.unit-tests.result }}" == "failure" ]]; then FAILED=1; fi
          if [[ "${{ needs.integration-tests.result }}" == "failure" ]]; then FAILED=1; fi
          if [[ "${{ needs.feature-tests.result }}" == "failure" ]]; then FAILED=1; fi
          if [[ "${{ needs.frontend-tests.result }}" == "failure" ]]; then FAILED=1; fi
          if [[ "${{ needs.full-tests-pgsql.result }}" == "failure" ]]; then FAILED=1; fi
          if [[ "${{ needs.security-audit.result }}" == "failure" ]]; then FAILED=1; fi
          if [[ "${{ needs.db-consistency.result }}" == "failure" ]]; then FAILED=1; fi

          if [ $FAILED -eq 1 ]; then
            echo "❌ One or more jobs failed"
            exit 1
          fi
          echo "✅ All jobs passed successfully"

      - name: Send Slack Notification
        if: always() && github.event_name != 'pull_request'
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
          channel: '#ci-notifications'
          text: |
            CI Pipeline ${{ job.status == 'success' && '✅ PASSED' || '❌ FAILED' }}
            Branch: ${{ github.ref }}
            Commit: ${{ github.sha }}
            Actor: ${{ github.actor }}
          fields: repo,message,commit,author,action,eventName,ref,workflow
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        continue-on-error: true
