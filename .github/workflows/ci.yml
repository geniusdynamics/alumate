            sleep 2
          done
          echo "PostgreSQL is ready!"

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Run Migrations
        run: php artisan migrate --force

      - name: Run Feature Tests Only
        run: |
          php artisan config:clear
          ./vendor/bin/pest --parallel --testsuite=Feature --coverage --coverage-clover=tests/reports/coverage.feature.xml --coverage-html=tests/reports/coverage-html.feature --coverage-text=tests/reports/coverage.feature.txt

      - name: Upload Feature Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-feature
          path: |
            tests/reports/coverage.feature.xml
            tests/reports/coverage.feature.txt
          retention-days: 14

      - name: Upload Feature Coverage HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html-feature
          path: tests/reports/coverage-html.feature
          retention-days: 14

  full-tests-pgsql:
    name: Full Tests (PostgreSQL)
    runs-on: ubuntu-latest
    needs: [integration-tests, feature-tests]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready -U postgres" --health-interval=10s --health-timeout=5s --health-retries=3

      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: dom, curl, mbstring, zip, pcntl, pdo, pdo_pgsql
          tools: composer:v2
          coverage: xdebug

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer dependencies
