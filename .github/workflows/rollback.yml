name: Rollback Deployment

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to rollback'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging
          - development
      reason:
        description: 'Reason for rollback'
        required: true
        type: string
      target_release:
        description: 'Target release to rollback to (optional, defaults to previous)'
        required: false
        type: string
        default: ''
      restore_database:
        description: 'Restore database from backup (requires backup file)'
        required: false
        type: boolean
        default: false
      backup_file:
        description: 'Backup file name (if restore_database is true)'
        required: false
        type: string

env:
  PHP_VERSION: '8.3'

jobs:
  rollback:
    name: Rollback ${{ github.event.inputs.environment }}
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event.inputs.environment }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up environment variables
        id: env
        run: |
          echo "DEPLOY_ENV=${{ github.event.inputs.environment }}" >> $GITHUB_ENV

          if [ "${{ github.event.inputs.environment }}" == "production" ]; then
            echo "DEPLOY_HOST=${{ secrets.PROD_HOST }}" >> $GITHUB_ENV
            echo "DEPLOY_USER=${{ secrets.PROD_USER }}" >> $GITHUB_ENV
            echo "DEPLOY_KEY=${{ secrets.PROD_SSH_KEY }}" >> $GITHUB_ENV
            echo "DEPLOY_PATH=${{ secrets.PROD_PATH }}" >> $GITHUB_ENV
            echo "DEPLOY_CHANNEL=#production-alerts" >> $GITHUB_ENV
            echo "DB_HOST=${{ secrets.PROD_DB_HOST }}" >> $GITHUB_ENV
            echo "DB_USERNAME=${{ secrets.PROD_DB_USER }}" >> $GITHUB_ENV
            echo "DB_PASSWORD=${{ secrets.PROD_DB_PASSWORD }}" >> $GITHUB_ENV
            echo "DB_DATABASE=${{ secrets.PROD_DB_NAME }}" >> $GITHUB_ENV
            echo "DOMAIN=${{ secrets.PROD_DOMAIN }}" >> $GITHUB_ENV
          elif [ "${{ github.event.inputs.environment }}" == "staging" ]; then
            echo "DEPLOY_HOST=${{ secrets.STAGING_HOST }}" >> $GITHUB_ENV
            echo "DEPLOY_USER=${{ secrets.STAGING_USER }}" >> $GITHUB_ENV
            echo "DEPLOY_KEY=${{ secrets.STAGING_SSH_KEY }}" >> $GITHUB_ENV
            echo "DEPLOY_PATH=${{ secrets.STAGING_PATH }}" >> $GITHUB_ENV
            echo "DEPLOY_CHANNEL=#staging" >> $GITHUB_ENV
            echo "DB_HOST=${{ secrets.STAGING_DB_HOST }}" >> $GITHUB_ENV
            echo "DB_USERNAME=${{ secrets.STAGING_DB_USER }}" >> $GITHUB_ENV
            echo "DB_PASSWORD=${{ secrets.STAGING_DB_PASSWORD }}" >> $GITHUB_ENV
            echo "DB_DATABASE=${{ secrets.STAGING_DB_NAME }}" >> $GITHUB_ENV
            echo "DOMAIN=${{ secrets.STAGING_DOMAIN }}" >> $GITHUB_ENV
          else
            echo "DEPLOY_HOST=${{ secrets.DEV_HOST }}" >> $GITHUB_ENV
            echo "DEPLOY_USER=${{ secrets.DEV_USER }}" >> $GITHUB_ENV
            echo "DEPLOY_KEY=${{ secrets.DEV_SSH_KEY }}" >> $GITHUB_ENV
            echo "DEPLOY_PATH=${{ secrets.DEV_PATH }}" >> $GITHUB_ENV
            echo "DEPLOY_CHANNEL=#development" >> $GITHUB_ENV
            echo "DB_HOST=${{ secrets.DEV_DB_HOST }}" >> $GITHUB_ENV
            echo "DB_USERNAME=${{ secrets.DEV_DB_USER }}" >> $GITHUB_ENV
            echo "DB_PASSWORD=${{ secrets.DEV_DB_PASSWORD }}" >> $GITHUB_ENV
            echo "DB_DATABASE=${{ secrets.DEV_DB_NAME }}" >> $GITHUB_ENV
            echo "DOMAIN=${{ secrets.DEV_DOMAIN }}" >> $GITHUB_ENV
          fi

      - name: Send rollback notification (start)
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
          channel: ${{ env.DEPLOY_CHANNEL }}
          text: |
            🚨 **Rollback Initiated**
            Environment: ${{ github.event.inputs.environment }}
            Reason: ${{ github.event.inputs.reason }}
            Triggered by: ${{ github.actor }}
            Commit: ${{ github.sha }}
          fields: repo,message,commit,author,action,eventName,ref,workflow
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        continue-on-error: true

      - name: Create pre-rollback backup
        if: ${{ !github.event.inputs.restore_database }}
        run: |
          echo "${{ env.DEPLOY_KEY }}" > deploy_key
          chmod 600 deploy_key

          PRE_ROLLBACK_BACKUP="pre_rollback_$(date +%Y%m%d_%H%M%S).dump"
          echo "Creating pre-rollback backup: $PRE_ROLLBACK_BACKUP"

          ssh -i deploy_key -o StrictHostKeyChecking=no \
            ${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }} \
            "PGPASSWORD='${{ env.DB_PASSWORD }}' pg_dump -h ${{ env.DB_HOST }} -U ${{ env.DB_USERNAME }} -d ${{ env.DB_DATABASE }} --compress=9 --format=custom --file='$PRE_ROLLBACK_BACKUP' --no-owner --no-privileges"

          echo "PRE_ROLLBACK_BACKUP=$PRE_ROLLBACK_BACKUP" >> $GITHUB_ENV
          echo "✅ Pre-rollback backup created"

      - name: Restore database from backup
        if: ${{ github.event.inputs.restore_database }}
        run: |
          if [ -z "${{ github.event.inputs.backup_file }}" ]; then
            echo "❌ Backup file not specified"
            exit 1
          fi

          echo "${{ env.DEPLOY_KEY }}" > deploy_key
          chmod 600 deploy_key

          BACKUP_FILE="${{ github.event.inputs.backup_file }}"
          echo "Restoring database from backup: $BACKUP_FILE"

          # Check if backup exists on server
          if ! ssh -i deploy_key -o StrictHostKeyChecking=no \
            ${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }} \
            "test -f ${{ env.DEPLOY_PATH }}/$BACKUP_FILE"; then
            echo "❌ Backup file not found on server: $BACKUP_FILE"
            exit 1
          fi

          # Restore database
          ssh -i deploy_key -o StrictHostKeyChecking=no \
            ${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }} \
            "cd ${{ env.DEPLOY_PATH }} && PGPASSWORD='${{ env.DB_PASSWORD }}' pg_restore --clean --if-exists -h ${{ env.DB_HOST }} -U ${{ env.DB_USERNAME }} -d ${{ env.DB_DATABASE }} $BACKUP_FILE"

          echo "✅ Database restored from backup"

      - name: Perform rollback
        run: |
          echo "${{ env.DEPLOY_KEY }}" > deploy_key
          chmod 600 deploy_key

          if [ -n "${{ github.event.inputs.target_release }}" ]; then
            TARGET_RELEASE=${{ github.event.inputs.target_release }}
            echo "Rolling back to specific release: $TARGET_RELEASE"
            
            ssh -i deploy_key -o StrictHostKeyChecking=no \
              ${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }} \
              "cd ${{ env.DEPLOY_PATH }} && \
               rm -f current && \
               ln -sf $TARGET_RELEASE current && \
               cd current && \
               php artisan config:cache && \
               php artisan route:cache && \
               php artisan up"
          else
            echo "Performing automatic rollback to previous release..."
            
            ssh -i deploy_key -o StrictHostKeyChecking=no \
              ${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }} \
              "cd ${{ env.DEPLOY_PATH }} && \
               ./deploy.production.sh rollback"
          fi

      - name: Health check after rollback
        run: |
          MAX_RETRIES=30
          RETRY_INTERVAL=10
          URL="https://${{ env.DOMAIN }}/health-check"

          for i in $(seq 1 $MAX_RETRIES); do
            echo "Health check attempt $i/$MAX_RETRIES..."
            if curl -sf --max-time 10 "$URL"; then
              echo "✅ Rollback health check passed"
              exit 0
            fi
            echo "Health check failed, retrying in ${RETRY_INTERVAL}s..."
            sleep $RETRY_INTERVAL
          done

          echo "❌ Rollback health check failed after $MAX_RETRIES attempts"
          exit 1

      - name: Send rollback notification (success)
        if: success()
        uses: 8398a7/action-slack@v3
        with:
          status: success
          webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
          channel: ${{ env.DEPLOY_CHANNEL }}
          text: |
            ✅ **Rollback Completed Successfully**
            Environment: ${{ github.event.inputs.environment }}
            Reason: ${{ github.event.inputs.reason }}
            Rolled back by: ${{ github.actor }}
          fields: repo,message,commit,author,action,eventName,ref,workflow
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        continue-on-error: true

      - name: Send rollback notification (failure)
        if: failure()
        uses: 8398a7/action-slack@v3
        with:
          status: failure
          webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
          channel: ${{ env.DEPLOY_CHANNEL }}
          text: |
            ❌ **Rollback Failed!**
            Environment: ${{ github.event.inputs.environment }}
            Reason: ${{ github.event.inputs.reason }}
            Failed for: ${{ github.actor }}
            **Manual intervention required!**
          fields: repo,message,commit,author,action,eventName,ref,workflow
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        continue-on-error: true

      - name: Update deployment status on monitoring
        if: always()
        run: |
          DEPLOY_STATUS="rollback"
          if [ "${{ github.event.inputs.environment }}" == "production" ]; then
            curl -X POST "https://api.monitoring.your-domain.com/deployments" \
              -H "Content-Type: application/json" \
              -d "{\"status\":\"${DEPLOY_STATUS}\",\"environment\":\"${{ github.event.inputs.environment }}\",\"sha\":\"${{ github.sha }}\",\"reason\":\"${{ github.event.inputs.reason }}\",\"timestamp\":\"$(date -Iseconds)\"}" \
              --silent --output /dev/null || true
          fi
