name: CI Enhanced

on:
  push:
    branches:
      - develop
      - main
      - db
  pull_request:
    branches:
      - develop
      - main
      - db
  schedule:
    # Run security scans daily at 2 AM UTC
    - cron: '0 2 * * *'

env:
  NODE_VERSION: '22'
  PHP_VERSION: '8.3'

jobs:
  # Code quality checks
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: dom, curl, mbstring, zip, pcntl
          tools: composer:v2

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Run PHP Linting (Pint)
        run: vendor/bin/pint

      - name: Run JS Linting (ESLint)
        run: npm run lint

      - name: TypeScript Type Check
        run: npx vue-tsc --noEmit

      - name: Check PHPStan static analysis
        run: ./vendor/bin/phpstan analyse --level=5 --no-progress

      - name: Check for strict types declarations
        run: |
          STRICT_COUNT=$(grep -r "^declare(strict_types=1)" app/ | wc -l)
          TOTAL_FILES=$(find app -name "*.php" | wc -l)
          echo "Files with strict_types: $STRICT_COUNT / $TOTAL_FILES"
          if [ $STRICT_COUNT -lt $((TOTAL_FILES / 2)) ]; then
            echo "⚠️ Warning: Less than 50% of files have strict_types declaration"
          fi

  # Security checks
  security-checks:
    name: Security Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: dom, curl, mbstring, zip, pcntl

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Run Composer audit
        run: composer audit --no-interaction
        continue-on-error: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=high
        continue-on-error: false

      - name: Check for sensitive data
        run: |
          echo "Checking for hardcoded credentials..."
          PATTERNS="(password|secret|api_key|apikey|token|aws_access_key_id|aws_secret_access_key)"
          MATCHES=$(grep -rEi "$PATTERNS" --include="*.php" --include="*.env*" --include="*.json" --exclude-dir=vendor --exclude-dir=node_modules --exclude="*.md" . | grep -v "env(" | grep -v "config(" | grep -v "// " | grep -v "# " | head -20 || true)
          if [ -n "$MATCHES" ]; then
            echo "⚠️ Potential hardcoded credentials found:"
            echo "$MATCHES"
            exit 1
          fi
          echo "✅ No hardcoded credentials found"

      - name: Check for .env files in repository
        run: |
          ENV_FILES=$(find . -name ".env*" -type f ! -path "./.env.example" ! -path "./.env.testing" ! -path "./vendor/*" ! -path "./node_modules/*" 2>/dev/null || true)
          if [ -n "$ENV_FILES" ]; then
            echo "❌ Found .env files that should not be committed:"
            echo "$ENV_FILES"
            exit 1
          fi
          echo "✅ No unauthorized .env files found"

  # Unit tests (SQLite)
  unit-tests-sqlite:
    name: Unit Tests (SQLite)
    runs-on: ubuntu-latest
    needs: code-quality
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: dom, curl, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite
          tools: composer:v2
          coverage: xdebug

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Setup Environment
        run: |
          cp .env.example .env
          touch database/database.sqlite

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Run Unit Tests (SQLite)
        run: |
          php artisan config:clear
          ./vendor/bin/pest --parallel --testsuite=Unit --coverage --coverage-clover=tests/reports/coverage.unit.xml --coverage-text=tests/reports/coverage.unit.txt

      - name: Check Coverage Threshold
        run: |
          COVERAGE=$(grep -oP '\d+(\.\d+)?%' tests/reports/coverage.unit.txt | head -1 | tr -d '%')
          if (( $(echo "$COVERAGE < 80" | bc -l) )); then
            echo "❌ Code coverage ($COVERAGE%) is below minimum threshold (80%)"
            exit 1
          fi
          echo "✅ Code coverage ($COVERAGE%) meets minimum threshold (80%)"

      - name: Upload Unit Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-unit
          path: tests/reports/
          retention-days: 14

  # Integration tests (PostgreSQL)
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: code-quality
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready -U postgres" --health-interval=10s --health-timeout=5s --health-retries=3

      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: dom, curl, mbstring, zip, pcntl, pdo, pdo_pgsql
          tools: composer:v2
          coverage: xdebug

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Setup Environment
        run: |
          cp .env.example .env
          sed -i 's/DB_CONNECTION=sqlite/DB_CONNECTION=pgsql/' .env
          sed -i 's/DB_DATABASE=database\/database.sqlite/DB_DATABASE=test_db/' .env
          sed -i 's/DB_USERNAME=root/DB_USERNAME=postgres/' .env
          sed -i 's/DB_PASSWORD=/DB_PASSWORD=password/' .env
          sed -i 's/DB_HOST=127.0.0.1/DB_HOST=localhost/' .env
          sed -i 's/DB_PORT=3306/DB_PORT=5432/' .env

      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h localhost -p 5432 -U postgres; do
            echo "Waiting for PostgreSQL..."
            sleep 2
          done
          echo "PostgreSQL is ready!"

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Run Migrations
        run: php artisan migrate --force

      - name: Run Tenant Migrations
        run: php artisan tenants:migrate --force

      - name: Run Integration Tests
        run: |
          php artisan config:clear
          ./vendor/bin/pest --parallel --testsuite=Integration --coverage --coverage-clover=tests/reports/coverage.integration.xml

      - name: Upload Integration Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-integration
          path: tests/reports/
          retention-days: 14

  # Feature tests (PostgreSQL)
  feature-tests:
    name: Feature Tests
    runs-on: ubuntu-latest
    needs: code-quality
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready -U postgres" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: dom, curl, mbstring, zip, pcntl, pdo, pdo_pgsql
          tools: composer:v2
          coverage: xdebug

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Setup Environment
        run: |
          cp .env.example .env
          sed -i 's/DB_CONNECTION=sqlite/DB_CONNECTION=pgsql/' .env
          sed -i 's/DB_DATABASE=database\/database.sqlite/DB_DATABASE=test_db/' .env
          sed -i 's/DB_USERNAME=root/DB_USERNAME=postgres/' .env
          sed -i 's/DB_PASSWORD=/DB_PASSWORD=password/' .env
          sed -i 's/DB_HOST=127.0.0.1/DB_HOST=localhost/' .env
          sed -i 's/DB_PORT=3306/DB_PORT=5432/' .env

      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h localhost -p 5432 -U postgres; do
            echo "Waiting for PostgreSQL..."
            sleep 2
          done
          echo "PostgreSQL is ready!"

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Run Migrations
        run: php artisan migrate --force

      - name: Run Feature Tests
        run: |
          php artisan config:clear
          ./vendor/bin/pest --parallel --testsuite=Feature --coverage --coverage-clover=tests/reports/coverage.feature.xml

      - name: Upload Feature Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-feature
          path: tests/reports/
          retention-days: 14

  # Frontend tests and build
  frontend-tests:
    name: Frontend Tests & Build
    runs-on: ubuntu-latest
    needs: code-quality
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: dom, curl, mbstring, zip, pcntl
          tools: composer:v2

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Generate Ziggy Routes
        run: |
          php artisan ziggy:generate
        env:
          APP_KEY: base64:placeholder-key-for-frontend-build

      - name: TypeScript Type Check
        run: npx vue-tsc --noEmit

      - name: Run Frontend Tests (Vitest)
        run: npm test

      - name: Build Frontend Assets
        run: npm run build

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: public/build/
          retention-days: 7

  # Database consistency check
  db-consistency:
    name: Database Consistency
    runs-on: ubuntu-latest
    needs: code-quality
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready -U postgres" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: dom, curl, mbstring, zip, pcntl, pdo, pdo_pgsql
          tools: composer:v2

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Setup Environment
        run: |
          cp .env.example .env
          sed -i 's/DB_CONNECTION=sqlite/DB_CONNECTION=pgsql/' .env
          sed -i 's/DB_DATABASE=database\/database.sqlite/DB_DATABASE=test_db/' .env
          sed -i 's/DB_USERNAME=root/DB_USERNAME=postgres/' .env
          sed -i 's/DB_PASSWORD=/DB_PASSWORD=password/' .env
          sed -i 's/DB_HOST=127.0.0.1/DB_HOST=localhost/' .env
          sed -i 's/DB_PORT=3306/DB_PORT=5432/' .env

      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h localhost -p 5432 -U postgres; do
            echo "Waiting for PostgreSQL..."
            sleep 2
          done
          echo "PostgreSQL is ready!"

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Run Migrations
        run: php artisan migrate --force

      - name: Run Tenant Migrations
        run: php artisan tenants:migrate --force

      - name: Check Database Consistency
        run: |
          php artisan migrate:status
          php artisan tenants:migrate:status

      - name: Validate Schema
        run: |
          php artisan schema:dump
          ls -la database/schema/ || true

  # Notify on test completion
  notify:
    name: Notification
    runs-on: ubuntu-latest
    needs: [unit-tests-sqlite, integration-tests, feature-tests, frontend-tests, db-consistency, security-checks]
    if: always()
    steps:
      - name: Generate Summary
        id: summary
        run: |
          echo "test_results<<EOF" >> $GITHUB_OUTPUT
          echo "CI Enhanced Pipeline completed" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "Test Results:" >> $GITHUB_OUTPUT
          echo "- Unit Tests (SQLite): ${{ needs.unit-tests-sqlite.result }}" >> $GITHUB_OUTPUT
          echo "- Integration Tests: ${{ needs.integration-tests.result }}" >> $GITHUB_OUTPUT
          echo "- Feature Tests: ${{ needs.feature-tests.result }}" >> $GITHUB_OUTPUT
          echo "- Frontend Tests: ${{ needs.frontend-tests.result }}" >> $GITHUB_OUTPUT
          echo "- DB Consistency: ${{ needs.db-consistency.result }}" >> $GITHUB_OUTPUT
          echo "- Security Checks: ${{ needs.security-checks.result }}" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Post Summary
        run: |
          echo "${{ steps.summary.outputs.test_results }}"

      - name: Check Overall Status
        run: |
          if [[ "${{ needs.unit-tests-sqlite.result }}" == "failure" ]] || \
             [[ "${{ needs.integration-tests.result }}" == "failure" ]] || \
             [[ "${{ needs.feature-tests.result }}" == "failure" ]] || \
             [[ "${{ needs.frontend-tests.result }}" == "failure" ]] || \
             [[ "${{ needs.db-consistency.result }}" == "failure" ]] || \
             [[ "${{ needs.security-checks.result }}" == "failure" ]]; then
            echo "❌ Pipeline failed"
            exit 1
          fi
          echo "✅ All checks passed"

      - name: Send Slack Notification
        if: always() && github.event_name != 'pull_request'
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
          channel: '#ci-notifications'
          text: |
            CI Enhanced Pipeline ${{ job.status == 'success' && '✅ PASSED' || '❌ FAILED' }}
            Branch: ${{ github.ref }}
            Commit: ${{ github.sha }}
            Actor: ${{ github.actor }}
          fields: repo,message,commit,author,action,eventName,ref,workflow
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        continue-on-error: true
